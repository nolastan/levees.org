  date: "2007-08-25T12:28:55"
  content: "<p>I think that the Corps has done one hell of a job these past two years.  The problem does not lie in the Corps, but our politicians who have been decieving us for decades.  It is their responsibility to get us the money to upgrade our levees/flood control structures, and they have been too busy to do anything about it.  What we need to do is get some people in office who actually care about South Louisiana and will argue for our share of the money and not stick it in their freezer.</p>\n"
