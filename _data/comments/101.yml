  date: "2007-08-14T08:49:47"
  content: "<p>TIME magazine’s article, “The Threatening Storm,” undermines the real science and risk information citizens need to make informed decisions about rebuilding with its reckless disregard for the truth.</p>\n<p>The Corps provided TIME magazine with engineering, scientific and risk information derived from the Interagency Performance Evaluation Task Force’s (IPET) study done in the aftermath of Hurricane Katrina.  The IPET study has been independently peer reviewed by the American Society of Civil Engineers and the National Academies.  TIME chose to base their article on upon technical quotes that are not supported by science-based facts or the analysis done by IPET, ASCE or the National Academies.</p>\n<p>TIME magazine’s article, “The Threatening Storm,” fails to include relevant Corps, IPET or HPDC information that would provide readers with the balanced context needed to make informed decisions about the situation in southeast Louisiana.</p>\n<p>The Corps is committed to providing quality science and engineering, and to transparently communicating to the people of Louisiana about what coastal restoration and protection will, and will not, do for them in future storms.</p>\n<p>For more info, visit:<br />\n<a href=\"http://www.usace.army.mil/response.htm\" rel=\"nofollow ugc\">http://www.usace.army.mil/response.htm</a></p>\n"
