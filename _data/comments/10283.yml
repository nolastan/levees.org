  content: "<p>The signs of problems were already evident in 1992 when Orleans Parish dredged its east side of the 17th Street Canal, but Jefferson Parish did not dredge its west side. Folks who live in Lakeview would sometimes speak out loud about their concerns that they wondered how many years since then it would take for some major catastrophe to prove that the dredging had been done in a &#8220;cavalier&#8221; manner. We also wondered what other slip-shod work on the canal would lead to a major disaster that would inundate us altogether. Thanks to Levees.org and the reports by WWL-TV, now we know the full extent of the callousness that led to the post-Katrina flooding in our part of the city.</p>\n"
