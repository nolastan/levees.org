  content: "<p>Saying &#8220;Thank You&#8221; for all you&#8217;ve done just seems inadequate.<br />\nIt was always important to hold responsible the government entities we all rely on. More now than ever before, from my perspective. </p>\n<p>It makes me proud to try and heed your words, to, &#8220;Think Big&#8221;. </p>\n<p>&#8230;.and maybe, someone in their spare time, can look for our absent ethics. It&#8217;s gotten to the point that when someone does behave in an ethical manner they are considered &#8216;chumps&#8217;, &#8216;someone easy to get over on&#8217;. Hopeful that tide is changing.</p>\n"
