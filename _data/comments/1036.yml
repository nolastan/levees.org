  content: "<p>Saving face, saving ASCE, should not be<br />\nat the expense of the very soul of the<br />\nNation.<br />\nSome ASCE engineers dropped the ball, and<br />\npeople&#8217;s lives were washed  away, many<br />\n10&#8217;s of thousands.<br />\nDr Seed must understand this can&#8217;t<br />\nbe swept under the rug.<br />\nI applaud Levee- Org seeking to<br />\nuncover matters, to keep a spot light on the<br />\nissues.<br />\nProfessional engineers do not<br />\nact professionally if they coverup<br />\nwrong doing.<br />\nIt is so tragic, the back- scratching that has<br />\ngone on, that should stop, so<br />\nthe truth is not obstructed one more day.</p>\n"
