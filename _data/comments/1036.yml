  content: "<p>Ms Sandy:</p>\n<p>The Army Corps, its top Generals, admit(flat out admit) that the failures in New Orleans(the crumbling COE junk) were caused by the Government;</p>\n<p>SEE;</p>\n<p><a href=\"http://www.publicintegrity.org/investigations/broken_government/articles/entry/930/\" rel=\"nofollow ugc\">http://www.publicintegrity.org/investigations/broken_government/articles/entry/930/</a></p>\n<p>Some may accuse the Corps of seeking to cover up, but even in that the Corps failed, and did so miserably.<br />\nNo wonder, some are sending the Seed letter to the President, on whether the soul of ASCE was saved, given all the issues raised.<br />\nThese failures are happening, have happened in a broarder aspect of issues on dysfunctional GOV.</p>\n"
