  date: "2009-09-02T13:30:41"
  content: "<p>Levee ORG has a question:<br />\nWhy is the engineering community so reluctant to blame the Corp for the failures  ?<br />\nHas Levee Org looked at all the money the Corps passed out to engineering firms, &amp; which ones did levee designs(or related) and had some connection to the works, so called protection works around New Orleans.<br />\nTherein, lies the very answer to the question Levee Org raised.<br />\nSome have a misconception on the Corps, the Corps is largely a conduit to pass out large wads of money, to others, including engineering frims.<br />\nThings are done under the name Corps of Engineers, but it is some private engineering firm who did the desisgn, and even on some Corps drawings/ plans it notes who those private engineering frims were(are). La ruber stamp city.<br />\nAnd, how many of those private engineering frims were memebers of the ASCE.<br />\nA Professional PE has a PE #, when licensed.<br />\nThe designer of those plans was not some guy down at Kinkos Copy shop.<br />\nYes, it is rather amazing how so much was swept under the silty sands of wailing winds.<br />\nAlso, it has been known since 1965(when hurricane Besty hit) that winds would whip up a dangerous surge of water off of the Lake, and other water bodies headed towards New Orleans.<br />\nAny designer would have to take than into account if acting professionally with a PE license.<br />\nHow many failed to. Yes, how many, that is the tragic failure as well&#8211;the dark secret on that some(in high places) want to hide.<br />\nIs it that the ASCE does not care to have the American public and Congress know&#8212;despite the massive money(public funds) doled out to Corps contractors, who also employed licesned PE&#8217;s(Professional engineers)-<br />\nthe big SHEILD of silence hangs over this like a  dark cloud to hide the truth.<br />\nHow can that happen in America ?<br />\nIt should concern you, if you truly care abuout this Nation, and its well being.</p>\n"
