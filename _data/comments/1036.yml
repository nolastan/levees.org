  avatar: "ef4019f64103c2525c4259f95a6235bfdaa10e69fe99deb981a9823b8d606946"
  date: "2009-08-31T21:47:20"
  content: "<p>I know you are busy, some. The day is long,<br />\nthe bills are many.<br />\nBut, here is Dr Seeds beef with the  Profession, or some, it ramblings on so long, and so much, he is disturbed by something. Dr Seed is the most renowed civil engineer in the USA, his letter @ </p>\n<p><a href=\"http://blog.nola.com/times-picayune/2007/11/WFMarcusonIII_a_.pdf\" rel=\"nofollow ugc\">http://blog.nola.com/times-picayune/2007/11/WFMarcusonIII_a_.pdf</a></p>\n<p>Sandy in her video described it as an ethics complaint. Actually, in one part he panders to the USACE, in some other parts of the letter he goes on about saving the &#8220;soul&#8221; of his profession.<br />\nHe muses about saving the USACE, while going on about trolling for mula in CA.</p>\n<p>He rants about  the &#8220;light of day&#8221;, yet goes on about the USACE tactics to keep things in the dark.<br />\nBut Dr Seed did state in his letter:<br />\n&#8220;It was ethically and professionally offensive to the two assembled teams of experienced<br />\nexperts to be told that they were to simply wave, say that they had measured things, and that they<br />\nhad learned nothing. And at a time when a distraught population, and the government (both local<br />\nand federal) were in desperate need of some small sense that engineers were performing a straightforward,<br />\nhonest investigation and were making some progress. And when everyone needed a sense<br />\nof trust.&#8221;</p>\n<p>So, he was to act like a puppet on a USACE string, and it must have really miffed him off to write  a 42 page letter, and to send it to VIPs.<br />\nA P S is added about FEDERAL Prosecutors.<br />\nThe DOJ usually represents the ARMY Brass at the highest level of the Pentagon.</p>\n<p>He ends  his fear the letter may find its way in less than trust worthy hands&#8230;. Holy  Crap, and trailer guy is going on about the MAJOR</p>\n"
