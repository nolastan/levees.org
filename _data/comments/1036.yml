  date: "2009-09-02T13:50:48"
  content: "<p>The Corps has records of all its phased design awards(at least it used to if records  were not destroyed) maybe the ones Congress never examined(some Subcommittees)<br />\nEven when Companies get Corps contracts, some often go get a big P R splash, for example:</p>\n<p><a href=\"http://ir.shawgrp.com/phoenix.zhtml?c=61066&#038;p=irol-newsArticle&#038;ID=1060216&#038;highlight=\" rel=\"nofollow ugc\">http://ir.shawgrp.com/phoenix.zhtml?c=61066&#038;p=irol-newsArticle&#038;ID=1060216&#038;highlight=</a></p>\n<p>Of course, this is all interwoven with ear-marks, pork, and politics, some( the POLITICAL CLASS) may just not care for the American public to know the full truth on this sorry saga of shoddy work, and deadly failures.</p>\n<p>Was there any Corps Contractor&#8212;PERSON&#8211; who spoke up, had letters to the Corps warning of things,(pre 2005) is that realistic, that no Corps contractor(PERSON) that had a PE(professional engineer), formally communicated to the COE, since 1965, with any dire warnings.<br />\nReally, is that real.<br />\nWhat does that say about the ASCE ?<br />\nSome might wonder about that, really they might.</p>\n"
