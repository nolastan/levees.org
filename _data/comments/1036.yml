  date: "2009-08-31T22:18:46"
  content: "<p>Even Dr Seed has been on some USACE gravy train, pay-loads.<br />\nNot that he was not deserving of such, or that it clouded his judgement(in that narrow CA incident.<br />\nIt was not in La, as to the matter, that most leaps to  data banks retrevials, but on the West Coast, closer to his Berkeley stomping grounds.<br />\nIf the USACE is not deserving of trust, Dr Seed is no high priest, or  endowed to spread holy water, Levee Org is acting to raise issues that are vital to Democracy in the Nation.<br />\nIf Dr Seeds 42 page letter is an ethics complaint, is he making ASCE some judge of the very soul shaking things he address to the profession.<br />\nThat seems a bit presumptious, if not arrogant.<br />\nNo wonder the ASCE is so snooty, it is<br />\nmost curious how a high school parody unhinged the ASCE</p>\n"
