  date: "2009-08-31T19:04:25"
  content: "<p>Sandy, didn&#8217;t the USACE( P R guy) tell Congress recently that USACE employees did not leave their citizenship at the front door, when they walk in the USACE Bldg, in reaction to the fuss over comments( the CALLS for&#8230;.).<br />\nMust be the same for Emergency Ops from some county(see on other item), who knows about Majors at(boots of )<br />\nAs far as the directions on boots go, it was rather earthy, but FEMA was the trailer fellows, not the USACE.<br />\nYou are the one who brought up the pecking order via civilans at the USACE.<br />\nYes, now a &#8220;Major&#8221; vintage has come up.<br />\nThe more the Corps screws up the more money Congress gives it, don&#8217;t you get it ?<br />\nLa get more of the USACE civil works pie than any place else in America.<br />\nIt has proved, major screw ups are rewarded with major money flows.<br />\nAmazing, but it has happened.<br />\nIs it something to do with the La purchase from France&#8211;still ?</p>\n"
