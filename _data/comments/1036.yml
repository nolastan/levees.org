  content: "<p>All those members of the ASCE, who got publib monies<br />\nwho designed, or inspected the failed<br />\nstructures in New Orleans, have any noticed<br />\ntheir names are kept in the dark by all the<br />\nother ASCE engineers  who did the so called<br />\ninvestigation on New Orleans.<br />\nIf that keeps up, the soul of the<br />\nprofession, will not be safed even if<br />\nDr  Seed  writes 42 books.<br />\nNo wonder some want true full sunshine.<br />\nNot in name only, but in reality.</p>\n"
