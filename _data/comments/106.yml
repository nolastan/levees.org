  avatar: "f0ccdcbf855eae0be8e8b1d01c3dff8ee840ec80880be1d269fc3a411252868f"
  date: "2007-08-29T09:59:36"
  content: "<p>Perhaps you are jumping the gun with respect to Corps of Engineers responsibilty.  I have read and I have heard that, in the &#8217;70&#8217;s, the Corps had planned to build floodgates from Lake Pontchartrain around the City of New Orleans.  The information I found was that the Corps was threatened by certain environmental groups and, because of the delays surrounding the potential lawsuit, the Corps abandoned the project.  Perhaps, it is the environmental groups who threatened the lawsuit who should be taken to task for the failure.</p>\n"
- id: 274
  parent: 0
  author: "Sandy Rosenthal"
  author_url: ""
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2007-08-31T20:27:34"
  content: "<p>Mr. Leicester,</p>\n<p>Yes, it&#8217;s true the Corps originally had wanted to build floodgates that did NOT include pumping capacity like those installed this year.  Those floodgates were blocked in the 70s by local interests who were worried about rainwater backing up into the city.  Nonetheless, for the Corps to claim they&#8217;re not responsible for the failure of their floodwall would be like the Dept of Transportation in Minneapolis claiming they&#8217;re not responsible for the failure of their bridge because originally they wanted to build a tunnel.</p>\n"
