  content: "<p>While I agree, that money should continue to be sent to help the City of New Orleans. I don&#8217;t think it should be given to the city or state governments. It is the grassroots organizations that have kept the spirit of New Orleans alive and who have sustained it&#8217;s people. While the Federal and state governments spent billions of no bid contracts, the grassroots organizations were delivering food, water, clothing, first aid, medical supplies, and who have remained to help.</p>\n<p>I mow lawns and clear lots for elderly property owners in the Lower Ninth Ward with the goal of saving their property from Seizers.</p>\n<p>President Bush spoke at the Martin Luther King Jr. School in the lower Ninth on August 29th 2007. That building was saved by Common Ground Relief and volunteers from colleges across the country who came on their own dime to help to gut the building over the passed two years. This saved the School over $500,000 in clean up costs and was the key factor in making it possible for the school to afford to reopen.</p>\n<p>If you want to help people in New Orleans help the organizations who are actually doing the work.</p>\n<p>here are a few links:<br />\n<a href=\"http://www.plenty.org\" rel=\"nofollow ugc\">http://www.plenty.org</a><br />\n<a href=\"http://neworleansvfp.ning.com\" rel=\"nofollow ugc\">http://neworleansvfp.ning.com</a></p>\n"
