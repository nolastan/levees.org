  content: "<p>ANd just one more comment</p>\n<p>Instead of cutting down the trees along the grass mound levees in Lakeview and into Jefferson parish..especially of native species..you know roots and all ..the old ..hold the soil idea..The Corps should have left the trees and planted vetiver hedges below the trees&#8230;with the singular capacity not only to embed straight down into varied kinds of soil to 6-9 feet&#8230;see photos on site of root system..but with the capacity to save in wash back around the vetiver stalks any soil eroding from above&#8230;</p>\n<p>Did they do that?  How many bioengineers are within the Corps of Engineers stable of Engineers?</p>\n<p>Ok&#8230;I am finished&#8230;Cheers&#8230;</p>\n"
