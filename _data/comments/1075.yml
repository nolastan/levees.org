  author: "Patty Whalen"
  author_url: ""
  avatar: "a606ecf6c22e0188af332ff7749b5182e4f9ed0c11de2e7b6a5fc8c8f77e8a28"
  date: "2009-09-04T17:17:49"
  content: "<p>The following citation comes from the <a href=\"http://www.vetiver.org\" rel=\"nofollow ugc\">http://www.vetiver.org</a> site I mentioned above&#8230;”Sunshine” vetiver is a traditional, non-fertile Louisiana cultivar (variety) that was introduced to the Gulf region in the<br />\nFrench colonial era over 200 years ago. In principle, non-native plants intended for use in environmental protection or<br />\nagriculture must be investigated for their potential to become weeds or to act as intermediate hosts for pests that affect<br />\neconomically important crops. Sunshine vetiver was officially released from observation by the USDA Golden Meadows<br />\nPlant Material Center, in Louisiana in 1995. Refer to <a href=\"http://plant-materials.nrcs.usda.gov/lapmc/releases.html\" rel=\"nofollow ugc\">http://plant-materials.nrcs.usda.gov/lapmc/releases.html</a> The South<br />\nEastern Exotic Pest Plant Council, declared in May 2001 that Sunshine vetiver is acceptable for use in the region. Refer<br />\nto: <a href=\"http://www.se-eppc.org/fslist.cfm\" rel=\"nofollow ugc\">http://www.se-eppc.org/fslist.cfm</a>. More recently, the Pacific Island Ecosystem at Risk (PIER) Project carried out a risk<br />\nassessment of non-fertile vetiver grass cultivars from South India (Sunshine, US and Monto, Australia). A rating of +1<br />\nmeans that the plant species is “low risk” for invasiveness. Vetiver grass was rated negative eight (-8). The very low risk<br />\nrating is based on the Australia/New Zealand weed risk assessment protocol, modified for Hawaii by the USDA and<br />\nother cooperators. The link to the PIER risk assessment for vetiver grass is: <a href=\"http://www.vetiver.org/USA_PIER.h\" rel=\"nofollow ugc\">http://www.vetiver.org/USA_PIER.h</a>&#8230;&#8221;</p>\n<p>1995? and USDA used the low risk invasion rating used in Australia..which has been using this plant for some time&#8230;</p>\n<p>So what do you think the issue about ole Vetiver has been? Huh?</p>\n"
