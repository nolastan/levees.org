  author: "Patty Whalen"
  author_url: ""
  avatar: "a606ecf6c22e0188af332ff7749b5182e4f9ed0c11de2e7b6a5fc8c8f77e8a28"
  date: "2009-09-04T16:54:26"
  content: "<p>Oh and when you do go to the Vetiver International site..do note that on the very front opening page&#8230;they cite Vetiver<br />\nSunshine cultiver as recently(only recently ..got that?)being approved by USDA et al for use for some of the very issues I cite above.</p>\n<p>The name Sunshine cultiver&#8230;where did that come from&#8230;Hold on&#8230;right over in Sunshine La&#8230;right across the lake..yep that&#8217;s right&#8230;</p>\n<p>Go look at the root system on this grass and its characteristics&#8230;go read everything you can about it on this site..<br />\nand then..tell me? Why No Vetiver anywhere<br />\nin their plans anywhere?</p>\n<p>Could it be that it costs so little that trained volunteers have planted it all over the world effectively&#8230;could  it be that the rock and concrete steel people..contractors&#8230;just do not like that?</p>\n<p>According to a survey on this site of<br />\nentities using vetiver&#8230;this objection served as one of the top three reasons why in their countries they had to work long and hard and fight to use the vetiver<br />\nWell&#8230;you decide after you read this site thoroughly..It will take a while .There is a lot there and a lot more coming.</p>\n"
- id: 1351
