  date: "2009-09-04T16:28:37"
  content: "<p>The video is excellent indeed. I was amazed at the precision of the capacity to manage the water levels in the day to day.</p>\n<p>The levels of the water are managed very close to the top of the land with it appears a great deal of confidence in those levels of close tolerances.</p>\n<p>Clearly this video and the practice of the Dutch reveals even more powerfully why the<br />\n.&#8221;.let&#8217;s get the backhoes and find some more clay somewhere et al methods&#8221; of the US Corps of Engineers are at this point in the technology of water management nothing less than &#8220;neanderthal&#8221;.</p>\n<p>Moreover the Corps of Engineers is also way behind by many years regarding the world wide use of additional or in some cases primary use of bioengineering compontents used everywhere but here!<br />\nGo to <a href=\"http://www.vertivert.org\" rel=\"nofollow ugc\">http://www.vertivert.org</a></p>\n<p>Vetivert&#8230;ironically a grass that has grown here for at least 200 years and which shares genetic mirroring of much of the vetivert found around the world and used for flood and erosion mitigation as well as land mass and marsh reconstitution and which through research has as well been moved to more and more tolerances re salinity is not even known by them&#8230;<br />\nAnd the LSU extension service as far as I can find&#8230;last did research in the 80s&#8230;Things have moved so far beyond that time&#8230;</p>\n<p>I urge everyone to research and read about this powerful mitigation and its uses esp in Australia&#8230;I have done so for years..<br />\nThanks Sandy and Mr. Bosworth for your excellent film here!.and of course all of your work!<br />\nWe  Can and We DO..oh would someone please remind Pres Obama that in his recent TP interview..he continues to cite what happened after Katrina as a &#8220;natural diseaster&#8221;&#8230;I</p>\n"
