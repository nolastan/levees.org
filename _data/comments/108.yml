  content: "<p>Tom infers that blame belongs on local sponsors that cut the grass on the C.O.E. designed and built levees. I suggest to him that when Louisiana residents send their hard earned tax dollars to washington they expect as does every American to receive what they pay for. If the rest of the country is not interested in returning our tax dollars as required then don&#8217;t accept them. We will gladly keep our tax dollars here and take care of our own problems without federal oversight and corruption. Louisiana has the #1 port system in the world, supplies fully 1/3 of the nations energy supply, is one of the nations largest seafood producer, and #1 football team in the nation LSU. This nation went to France to purchase NEW ORLEANS because of it&#8217;s national importance. The rest was lagnaippe.</p>\n"
