  content: "<p>New Orleans History: Thank heavens that the truth is getting out in a timely manner. Because of the 300th anniversary, fortunately, you will find in the local newspapers articles about historical events that have been previously recorded with lots of errors or omissions, that historians are now scrambling to uncover and correct.</p>\n"
