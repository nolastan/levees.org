  avatar: "1180c49ce90eaa2d187f5d48d4806afaec4707cc78e4c132ac5349b7c4a02762"
  date: "2009-09-10T21:00:51"
  content: "<p>The levees were fated to fail: Years ago, I wondered why all the money was put out to build that high wall on the Lakeview side of the Orleans Canal &#8212; with cute little Greek-shaped things along the top. If the City was going to strengthen one levee, why wouldn&#8217;t it strengthen them all? Then I had a premonition &#8212; I&#8217;m no psychic, but I am a student of history and politics &#8212; that the City didn&#8217;t give a &#8220;snap of the fingers&#8221; about the solidity of the other levees, and it never would.</p>\n<p>Three family members with whom I lived died in our house in Lakeview in the stinking, freezing waters of 2005. The Levee Board and the Army Corps of Engineers murdered them. Enough said.</p>\n"
