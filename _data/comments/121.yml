  content: "<p>My question is, did levees.org say anything in the spoof that was incorrect?  Did the Army Corps, in fact, undertake to investigate itself (a conflict of interest), and did they pay the ASCE lots of money to be their &#8220;expert&#8221; review panel?  If not, then where would they have a leg to stand on in a legal battle?  I understand that they would do their best to bleed levees.org dry in court just to prove that they can, but they&#8217;d lose, wouldn&#8217;t they?  And they&#8217;d look even worse for the attempt&#8230;</p>\n"
