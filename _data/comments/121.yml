  content: "<p>Dear MMaldonado:<br />\nLevees.Org stands behind every single word of our PSA.  But if Levees.Org chose to ignore the Cease and Desist and if ASCE chose to press forward, we don&#8217;t have the money nor the peoplepower to wage a legal battle with a giant trade organization.  Interestingly, the Cease and Desist (and our acquiescence) has drawn even more attention to the PSA.</p>\n"
