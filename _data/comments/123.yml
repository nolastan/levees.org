  date: "2008-01-31T01:10:01"
  content: "<p>Sandy, your statement that the Corp&#8217;s negligence represented the worst engineering failure &#8220;since Chernobyl&#8221; is great, really terrific rhetoric besides being true, perhaps even an understatement by standard of lives lost, urban community destroyed, end of a unique culture beloved worldwide.</p>\n<p>The judge&#8217;s reference to the &#8220;byzantine&#8221; funding mechanisms involved takes us to Bush administration&#8217;s cuts in funding levee maintenance for N. O. district going un-protested by our beloved congressman who was busy feathering his own nest, working as a full-time paid lobbyist in D. C. for foreign interests instead of &#8220;earmarking&#8221; for his district in what must be the safest seat around.</p>\n<p>Michael Kopacz</p>\n"
