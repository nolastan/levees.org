  date: "2009-10-13T09:40:25"
  content: "<p>Why is Ms. Rosenthal on national TV, going off on President Obama? He was not in office and had nothing to do with the debauchery of the flooding relief efforts in New Orleans.That is a bit arrogant for here to go after the current president with such ferocity! Why didn&#8217;t she go after George W. Bush, whom was in office and responsible for the failures of FEMA?</p>\n"
