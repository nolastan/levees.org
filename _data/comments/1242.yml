  date: "2009-10-13T10:20:05"
  content: "<p>I was invited to appear on MSNBC to talk about what I would say to President Obama if I am granted an audience while he is New Orleans for a one-day visit on October 15, 2009. </p>\n<p>Chris Matthews did not ask me about the flood relief efforts or the failures of FEMA.  Chris asked me about the loss of the wetlands which made New Orleans vulnerable to stormsurge.</p>\n"
