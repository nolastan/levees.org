  date: "2008-03-03T21:16:03"
  content: "<p>We need to think outside the box for our protection in LA.  We need legislation that allows LA to use federal funds appropriated for levee protection to be used as a voucher to hire private engineering firms, rather than the USACE, to build us the best designed levee protection system that can be built. We should have the right to privatize the entire situation in order to get the best results. That is the only way to circumvent the Corps of Engineers.  Everyone knows that only second tier engineers and below are the type of people who work for the government. The best and the brightest work for the best engineering firms in the country with the best salaries.  Our tax dollars should be used to purchase the very best this country has to offer in sound flood protection!</p>\n"
