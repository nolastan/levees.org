  date: "2009-10-13T09:52:06"
  content: "<p>I just heard one of your spokes persons talking to Chris Matthews.  Your cause seems misguided and backward looking.  If you want sympathy from engineers or anyone else, then you need to start talking about moving the New Orleans population in-land to higher ground.</p>\n<p>Trying to blame the Corps of Engineers on New Orleans problems is not helpful to your cause.  If I was with the Corps today, I would decline future missions to New Orleans based on the attitude of some folks playing a blame game and the fact that rebuilding New Orleans would not be permitted if this was considered new construction.</p>\n<p>No engineer would permit construction in areas below sea level and near a body of water, and if NOAA building standards are applied then construction would not be permitted unless the structure is 35 feet above sea level and near a body of water.  </p>\n<p>If the folks in LA and New Orleans want to roll the dice with their own money and global warming, then that is your right.  American tax payers should not fund any repair or construction unless the structure meets NOAA building standards.</p>\n"
- id: 1913
