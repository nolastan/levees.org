  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2009-10-13T10:27:23"
  content: "<p>The Corps cannot &#8220;decline missions&#8221; to New Orleans.  By federal mandate, Congress decides what projects the Corps will do and how much money to spend to protect New Orleans from hurricanes.  </p>\n<p>Further, it&#8217;s not true that &#8220;no engineer would permit construction in areas below sea level.&#8221;  Most of Holland is below sea level and they have some of the most respected engineers in the world.</p>\n"
