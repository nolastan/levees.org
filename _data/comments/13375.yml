  content: "<p>This looks more like a map of cities and towns where a dam of some sort exists. I see the entirety of Barnstable County Massachusetts and all non-desert and some desert area in California is shaded. There is virtually zero inhabited area in Barnstable County that is protected by a stricture that is typically identified as a levee. To count an entire county&#8217;s population when there is, perhaps a small dam or several small dams is not appropriate. I think it hurts your mission to have misleading information on your site.</p>\n"
