  author: "Michael Conforti"
  author_url: ""
  avatar: "3bf16f812a3438ab8875e67bbf407b183ca25619a9f187c0c8697ecdf5f0db1e"
  date: "2009-10-15T07:54:41"
  content: "<p>I listened to Chris Matthews interview with Sandy Rosental and thought he was very even-handed, clearly interested in getting to the crux of the case she&#8217;d bring to the president about the disaster in New Orleans. Ms. Rodenthal couldn&#8217;t give a clear answer other than the fact that it was an engineering failure &#8211; and I am still in the dark about what she&#8217;s advocating we do now.</p>\n"
- id: 1965
  parent: 0
  author: "S. Rosenthal"
  author_url: ""
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2009-10-15T07:59:01"
  content: "<p>Dear Michael,</p>\n<p>Levees.org advocates for a truly independent review of the flood protection failures, and the decision making involved, on August 29, 2005.</p>\n<p>With 55% of the American people living in counties protected by levees, the majority of us could benefit.</p>\n<p>Click here to contact your members of Congress:<br />\n<a href=\"http://salsa.wiredforchange.com/o/1625/t/4583/campaign.jsp?campaign_KEY=2949\" rel=\"nofollow ugc\">http://salsa.wiredforchange.com/o/1625/t/4583/campaign.jsp?campaign_KEY=2949</a></p>\n<p>We also advocate that Obama please not mislead the American people.  On August 29, 2005, Mississippi got hit by a natural disaster; Louisiana got hit by a manmade disaster.</p>\n"
- id: 2015
  parent: 0
  author: "M. Watters"
  author_url: ""
  avatar: "32a7b025c4aff4e228bfbf5f726e3bcc3a6f6fbee372bcc6e66d8c778d174dba"
  date: "2009-10-18T23:35:17"
  content: "<p>I was just reading the news on my phone, and Ms. Rosenthal said her disappointment with Obama&#8217;s visit was intense, mostly because he referred to Katrina as a &#8220;disaster of nature&#8221;  Rosenthal said the levee failures that sent water pouring into the city prove it was a man made disaster,too.Obama&#8217;s failure to recognize that felt like a tactic to show that recovery money was coming from the &#8220;realm of largesse and generosity&#8221; rather than a government obligation to help New Orleans. I believe Hurricane Katrina as with any other hurricane IS a natural disaster. Yes, the levees did fail, but that city like many others are on the coast.It is the path of a hurricane. Are we going to build walls to block tornadoes and when they fail,blame the government? Even though the levees did fail, it could have been worse. Who are we going to blame when &#8220;Mother NATURE&#8221; has had enough of our irresponsible ways of taking care of this planet? The government?</p>\n"
- id: 2017
  parent: 0
  author: "S. Rosenthal"
  author_url: ""
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2009-10-19T07:55:23"
  content: "<p>New Orleans is not a coastal city.  Besides, levee failure and flooding is not a coastal problem and that is irrelevant anyway.</p>\n<p>Regarding who we will blame for &#8220;our irresponsible ways,&#8221; well I imagine that depends on who the &#8220;we&#8221; is.  In the case of levee failure, that might be the US Army Corps of Engineers responsibility, by federal mandate.</p>\n"
- id: 2031
  parent: 0
  author: "Tim Trice"
  author_url: "http://www.personalhurricanecenter.com"
  avatar: "c1a3cd2d3640a230b6f8db6ea5cd9c0f2b09cb66a33c1bdbe0669573e7ffda5c"
  date: "2009-10-20T11:51:59"
  content: "<p>Hurricane Katrina is and always will be a natural disaster.  Mankind is ignorant enough to continue to believe it can protect itself fully against the forces of nature.  It is natural that we are this way &#8211; a means of survival.</p>\n"
- id: 2034
  parent: 0
  author: "Kati"
  author_url: ""
  avatar: "ef23b1c985a30740e8df70d8b95ff9217605814a8baf47427825e05eacab97fc"
  date: "2009-10-20T14:54:01"
  content: "<p>There is no argument that Hurricane Katrina was a natural, disastrous event. It was a powerful, Cat 4 storm, and it&#8217;s winds and rain wreaked havoc in Mississippi as well as Louisiana. </p>\n<p>But, Tim, there is indeed a high limit to what can humanly be done to protect New Orleans especially. It ought to be protected for its value as a port and as a city that has become a national treasure. So it is worth protecting to the best of our collective abilities. </p>\n<p>And therein lies the trouble and the dirty truth. The complex levee system built to protect the city from flooding due to an extremely powerful storm surge FAILED. The levees were not breached, they BROKE. Weak levees were not what the Army Corps was assigned to created. So the Army Corps of Engineers failed doing their part to prevent disastrous flooding. </p>\n<p>BOTTOM LINE: the Flood that destroyed lives, homes, entire neighborhoods, displaced families and killed people &#8211; American citizens &#8211; was simply a direct result of levees breaking down — levees designed to withstand a natural disaster of this magnitude. The technology and ability was and IS there, but the job was not done. Who&#8217;s accountable?</p>\n<p>Another point to Tim: Do you sincerely think that mankind is ignorant enough to believe we can withstand any force of nature? Come on! Of course we&#8217;re not!  Don&#8217;t belittle this issue.</p>\n"
- id: 2098
  parent: 0
  author: "Clarence Rogozinski"
  author_url: ""
  avatar: "90749134376ee44cf035df90f8ac75f078950b2b2adf8ffd25df9f8802eeb115"
  date: "2009-10-26T12:57:52"
  content: "<p>The levees were breached or they broke, whichever is not important, they did fail to do the intended job.  However, rebuilding in the same spot is nothing if not stupid.who in their right mind builds below sea level.<br />\nIt is all regrettable,the loss of life is especially tragic, however, should we not learn from this?  Do not not tempt nature to destroy your fantasies.</p>\n"
