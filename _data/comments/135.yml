  content: "<p>I have seen a couple of these presentations and they do paint a picture of a completely corrupt government and ignorant population in an apparent attempt to draw attention from their own membership.  Their members are in every big consulting firm and throughout the Corps.  The ASCE, the Corps and the industry appreciates this coverup and spin campaign.</p>\n<p>It was the civil engineering industry that designed and constructed frail levees and worthless floodwalls with the Corps keeping them busy and paid.  Our local politicians and business leaders should be screaming about this because the engineers are too scared to speak up.</p>\n<p>Is the entire engineering profession corrupt? Spineless?</p>\n"
