  content: "<p>Sandy is right. According to actuary Rick Anderson (see &#8220;expert&#8217;s statements&#8221;), this protection translates into a 39.4% chance of occurrence over 50 years.</p>\n<p>But there&#8217;s more: The 100-year flood standard reflects flooding caused by either rain or upstream rivercourse overflow, NOT HURRICANES. This point is critical: The direction and effect of a storm surge cannot be pre-determined in the way that a river flood can be. Hurricanes move unpredictably and can approach from many different locations at every possible angle and at different speeds. Even the quadrant of the storm that strikes land affects the storm surge.</p>\n<p>A really good question to ask right now is how the Corps determined the &#8220;100-year flood&#8221;. After all that has transpired, I&#8217;m suspicious that our buddies in the Army are yet again trying to elude accountability by smearing lipstick on their warthog.</p>\n"
