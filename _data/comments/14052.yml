  content: "<p>I read your book, Mrs. Rosenthal.  I admire your bravery taking on the Feds (Army Corps).  My heart was filled with sadness on 08/29/2005.  I wanted to so badly volunteer and I couldn’t because of my job.  However, I made donations to help.  I experienced going through flooding in June 2001. At the time, I lived in Houston.  Tropical Storm Alison dumped 40+ inches of rain. I was lucky that I lost a car. Others were not so lucky.  I had a bottom apartment.  If I ever live in another apartment, it will be on the 2nd and above floors.</p>\n<p>I’m retired now.  I guess you could say semi retired. </p>\n<p>I’m a frequent visitor to NOLA because of part time work.  I love NOLA.  I love the Cajun Seafood which is hard to find currently where I live.</p>\n"
