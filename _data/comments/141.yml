  content: "<p>Right now on June 18, 2008, on CNN we see another spin being done by the Corps of Engineers&#8230;all these levees all along the river have, he says, served their purposes&#8230;Got that?  Farmland is flooded; houses look like our beloved New Orleans three years ago, with water to the roof&#8230;FEMA and Federal Govt. response took days in the Midwest as we watched people sandbag, just as we have done so many times in the past.  Wake Up America!  Demand Action from Congress on the 8/29 Investigation&#8230;Demand answers from both candidates for the Presidency, other than easy talk&#8230;Demand answers from every candidated running for Congress.  Ask them all &#8230;Do you or do you not support an 8/29 independant investigation or not?  Wake up&#8230;.Act Now&#8230;</p>\n"
