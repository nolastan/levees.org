  content: "<p>FROM MILWAUKEE &#8211; Richard de Wilde estimates he lost hundreds of thousands of dollars this week when a foot of rain inundated his organic beef and vegetable farm in southwestern Wisconsin.</p>\n<p>&#8220;Out of our 100 acres of vegetables, we had easily 30 under water,&#8221; de Wilde, one of the state&#8217;s largest organic farmers, said in a phone interview Tuesday. &#8220;If that was all a loss, it&#8217;s $300,000. I&#8217;m thinking we&#8217;re going to be able to salvage some out of there, but certainly it&#8217;s more than $200,000 just counting crops.&#8221;</p>\n<p>He&#8217;ll also have to replace fences, equipment and other water-damaged property at the 200-acre Harmony Valley Farm.</p>\n<p>The damage from this week&#8217;s floods could push some of Wisconsin&#8217;s organic farmers out of business and affect the price of organic products nationwide. Only California has more certified organic farms than Wisconsin, and more than a third of the Badger State&#8217;s 994 organic farms are in the five counties where rivers and streams overflowed.</p>\n<p>Organic farms in southeast Minnesota and northeast Iowa were affected by the rain as well.</p>\n<p>The governor held a news conference at 2:30 p.m. on Sunday to address the severe flooding across southwestern Wisconsin, WISC-TV reported. The state of emergency was declared for Vernon, Crawford, and Richland counties. In addition, those three counties have also declared local states of emergency as well.</p>\n<p>&#8220;Our No. 1 priority right now is to make sure that everybody is safe, and then to make sure that the infrastructure is strong,&#8221; said Doyle. &#8220;Then, as we move forward, helping people make sure that they are able to get back into their homes and back to their regular lives.&#8221;</p>\n<p>Doyle also authorized activation of the Wisconsin National Guard if deemed necessary by Maj. Gen. Al Wilkening, the state&#8217;s adjutant general.</p>\n<p>Well sounds allot like New Orleans almost three years ago, It is just like what happened and what was said by the government.</p>\n<p>First Priority &#8220;Make sure people are Safe&#8221; ?</p>\n<p>That was their job was before the levee&#8217;s failed!</p>\n<p>&#8220;Then, as we move forward, helping people make sure that they are able to get back into their homes and back to their regular lives.&#8221; sail Gov Doyle.</p>\n<p>That is what is wrong with government having responsibility for funding, contracting, safety inspections and inspection of maintenance. That is what is wrong with having line item veto power in the executive branch. Budgets can be made dangerous because of this power will be used politically rather than effectively.</p>\n<p>What happened to New Orleans August of 2005 and what is happening now are the product of individuals in government who use their responsibilities and control over contracts and used the power invested in them for politics and profit from disasters we the people face. Guess what?  The flood waters that wiped out the organic farms that fed thousands of people here after Hurricane Katrina is headed this way! Two weeks from now The Surge will hit New Orleans Mississippi Levee walls. Politicians in parishes North will be asked to open their spillways before the water tops the levees in more populated areas Like New Orleans.  From Wisconsin to Mississippi the people and the government don&#8217;t want that water in their backyards! So why should it be any different here in Louisiana?</p>\n<p>All Politics are local</p>\n<p>The people need to understand that they are responsible for electing the men and women who say they are defending our safety. When those trusted with our safety, security, and goals of prosperity choose continue a to war without just cause in stead of paying for levee improvements, barrier island reconstruction or god for bid the establishment of wetlands for flood control.</p>\n<p>They also need to understand that people who will lie to you about your safety and then send your children off to war for those lies, then take money away from the protection of your food, shelter, transportation, means of work, and expression of culture are not the people you want in charge when the next rain begins to fall. And the rain that fell in the north is headed right for New Orleans is just a few weeks.</p>\n"
