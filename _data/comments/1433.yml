  content: "<p>Hurricane Katrina was a category 3 storm when it hit land but had category 5 storm surges. The levees in New Orleans and surrounding areas were designed to withstand category 3 storm surge. The Army Corp of Engineers were trying to get funding to build cat.5 protection levees way before Katrina devastated Louisiana and Mississippi and were denied again and again. I think that this website is a joke. You should research things before you jump on the bandwagon. I just have to beleive that most of you are simple minded. I hope that none of you are apart of my generation.</p>\n"
