  content: "<p>After reading just the foreword and sample chapters, I can see that the situation in New Orleans was just as I envisioned it. I worked with Dr. Berkley Traughber for nine years during the 1980s. He was the Jefferson Parish Drainage Department&#8217;s consulting engineer. Together, we designed and built the Harvey Pumping Station on the Harvey Canal. Every sheet pile in our project was driven to &#8220;refusal&#8221;. That is the term used to describe when a piling can be driven no deeper usually due to reaching another geological layer such as the Pleistocene, the firmer layer which underlays New Orleans. I was the Resident Project Rep on the pumping station project when Hurricane Juan caused levee breeches on the west bank of the river. I spent three days there helping to direct the placement of massive concrete blocks in the breech. </p>\n<p>I had heard rumors about the engineering firm that designed the 17th Street Canal levee system. Traughber told me right then that the sheet piles in that levee were half as long as they needed to be. He said he warned people that the sheet pile wall would simply lay over when the high water came. They never listened.</p>\n<p>When he decided circa 2000 to cease acting as their consultant, Traughber was asked what the parish would do without him. He said, &#8220;You&#8217;re going to drown!&#8221; Sadly, it was a prophesy that was destined to come true. I guess he&#8217;d had enough of working with &#8220;jackleg&#8221; engineers. I&#8217;m getting ready to order a copy of the paperback and can&#8217;t wait to read it. I can tell already that it is going to five stars. Incidentally, I&#8217;m still waiting for the congressional inquiry of the fiasco of 2005.</p>\n"
