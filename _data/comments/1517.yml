  content: "<p>Has anyone looked into USING the materials from blighted properties in the New Orleans metro area to help reduce the cost of flood protection? How many megatons would be available just from foundation slabs? Plus all the brick work from apartment buildings? Point being that cost need to be reduced as much as possible while blighted properties also need to be cleaned up. Surely, somehow working together though various agencies, both goals could help each other?</p>\n"
