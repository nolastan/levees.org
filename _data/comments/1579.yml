  content: "<p>Thanks for pushing for a halt to the use of the term &#8220;Katrina flood&#8221; as the disaster&#8217;s name.  But,you didn&#8217;t go far enough. The federal government caused the horror.  You must give people a replacement term.  You have my permission to use my term, which is &#8220;The Federal Flood&#8221;. I have and always will refer to the flooding as the &#8220;Federal Flood&#8221;. I hope everyone else will too.</p>\n"
