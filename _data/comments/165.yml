  date: "2008-12-17T09:27:32"
  content: "<p>Dear KC,</p>\n<p>I spent over an hour in WWL TV&#8217;s studio talking about this issue, and of course only a sentence or two made it past the cutting room.</p>\n<p>These comments don&#8217;t scare or thwart me, in fact I welcome them.  I brought this to WWL because I had irrefutable documentation that tax payer computers are being used to send crafted messages to the American people, via my blogs.</p>\n<p>And we at  Levees.org don&#8217;t believe the message of these emails has come from the New Orleans District, good folks who live here with us behind these levees.  We believe they were created up the chain of command.</p>\n<p>During Katrina, the USACE had a massive failure, the worst civil engineering failure in the history of America, and the agency is afraid of losing its power.  We think these messages are crafted at a higher level in an attempt to re-write history and mislead the American public.</p>\n"
