  date: "2008-12-03T18:10:11"
  content: "<p>There you go again, Sandy, with another amateurish posting. Let&#8217;s examine your argument:</p>\n<p>1. Only a handful of civil engineers have stepped forward to castigate the US Army Corps of Engineers &#8211; That must really get your goat since you are so convinced that the Corps shoulders all responsibility for the damages suffered during Katrina.</p>\n<p>2. In the Levees.org parallel universe, the solution to this &#8220;problem&#8221; is quite obvious &#8211; The evil Corps, which is so inept at engineering, is brilliantly successful at public relations campaigns and punishing critics. Yes, that must be it because otherwise any self-respecting engineer would jump at the opportunity to &#8220;publicly rebuke and berate the Corps of Engineers for its well documented gross negligence.&#8221;</p>\n<p>Are you aware that the engineering profession has a code of ethics that is relevant in this situation? Here&#8217;s a link so you can educate yourself: <a href=\"http://www.asce.org/pdf/ethics_manual.pdf\" rel=\"nofollow ugc\">http://www.asce.org/pdf/ethics_manual.pdf</a></p>\n<p>Specifically, refer to fundamental canon 3. &#8220;Engineers shall issue public statements only in an objective and truthful manner.&#8221; The guidelines to practise for this canon state, in part:</p>\n<p>a. Engineers should endeavor to extend the public knowledge of engineering and sustainable development, and shall not participate in the dissemination of untrue, unfair, or exaggerated statements regarding engineering.<br />\nb. Engineers shall be objective and truthful in professional reports, statements, or testimony. They shall include all relevant and pertinent information in such reports, statements, or testimony.<br />\nc. Engineers, when serving as expert witnesses, shall express an engineering opinion only when it is founded upon adequate knowledge of the facts, upon a background of technical competence, and upon honest conviction.<br />\nd. Engineers shall issue no statements, criticisms, or arguments on engineering matters that are inspired or paid for by interested parties, unless they indicate on whose behalf the statements are made.</p>\n<p>In simple terms, a professional engineer is duty bound to be judicious in his/her statements of opinion. They do not have the open license of the lay person such as yourself to issue outrageous, unfounded statements. Many of your engineer heros have, in fact, violated this canon repeatedly and should be held accountable. Some of them are not even engineers &#8211; Van Heerden is a geologist with no professional engineering credentials. In fact, the LSU engineering department took him to task for violating the more general canon in academia of staying within your area of expertise and knowledge.</p>\n<p>The fact that most engineers are reluctant to join your Corps-bashing party is actually a tribute to their professional integrity.</p>\n"
