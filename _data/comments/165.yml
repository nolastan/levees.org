  date: "2008-12-16T19:33:14"
  content: "<p>Sandy, was it really necessary that you run off crying to WWL-TV about how the Corp was attacking you? You use your freedom of speech to bash the Corp but when someone argues against your opinion, you run off to the media like a little kid whose feelings just got hurt. C&#8217;mon Sandy, don&#8217;t waste WWL&#8217;s time anymore with such nonsense. You are soooooo obsessed with pointing the finger of blame at the Corp for everything that you will use anything you can to achieve your objective.</p>\n<p>It is your own fault Sandy for allowing comments to be posted on your blog. I guess now you are going to whois my IP. I&#8217;m pretty sure whenever you do, you will find it is outside the Corp&#8217;s IP range.</p>\n"
