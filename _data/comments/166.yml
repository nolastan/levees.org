  avatar: "b90d6b396320d7788a9b465d22ef8e3d7fd1e9ed83525066f48571a613bbabed"
  date: "2008-12-17T21:24:56"
  content: "<p>You should thank the Corps for bringing this into the national spotlight. Living in the Rocky Mountains, everyone I know cannot comprehend why one would live below the level of surrounding water then rely on our government for protection. The first thing the government should do is get out of the flood control business. Knock down all the levees and if the land is dry, that is where you can build. Either that or live in a stilt house and get there by boat. Quit waisting tax payer dollars on stupidity.</p>\n"
- id: 500
  parent: 0
  author: "Bruce Biles"
  author_url: "http://noladder.blogspot.com/"
  avatar: "cb17c73b9440a1f03f8cf74b61cf60f9e08c218905a4f3e075044f5e7a4a0349"
  date: "2008-12-19T20:48:56"
  content: "<p>Hey Bob, the other Bob&#8217;s not answering.<br />\nDo you know who he&#8217;s talking about?<br />\nJust who is this Uptown Lady?<br />\nDo you know what you are talking about?<br />\nOver half New Orleans is above sea level. That&#8217;s a fact.<br />\n<a href=\"http://blog.nola.com/times-picayune/2007/04/study_bust_myth_that_new_orlea.html\" rel=\"nofollow ugc\">http://blog.nola.com/times-picayune/2007/04/study_bust_myth_that_new_orlea.html</a><br />\n<a href=\"http://en.wikipedia.org/wiki/Lakeview,_New_Orleans#Geography\" rel=\"nofollow ugc\">http://en.wikipedia.org/wiki/Lakeview,_New_Orleans#Geography</a></p>\n<p>Another common misnomer is that not all New Orleanians are dopped-up looters. Some are quite ladylike. Even the ones who live Uptown.</p>\n<p>But the most common and dangerous misunderestimation of all is that Civil Engineering is a profession of ambiguous degree, like sanitation engineer.<br />\nNot only was my father both a Civil and Electrical engineer, but also a Lt Col in the US Air Force.<br />\nAnd, he thought the Corps of Engineers command should be drawn out and shot for dereliction of duty, overstepping their mandate, and lying about obvious first year engineering mistakes in those flood control structures.<br />\nBut, Bob, there are no 2nd Chances in Civil Engineering.<br />\nBut all I wanna know from you Bobs is&#8230;<br />\nWHO&#8217;DAT UPTOWN LADY???</p>\n"
