  author: "Robert McKnight"
  author_url: ""
  avatar: "f1d16a6bff2c5c197d3d6876c029edc7eb3eaf2f250d0f85ebcaf2746bac6ee7"
  date: "2008-12-17T10:51:14"
  content: "<p>I am a Hurricane Katrina survivor.  I listened to all the criticism of the Corps.  I remember the newspaper articles about the hurricane protections act passed by congress in 1967 and the picture of President Johnson signing the bill with Congressman Hale Boggs and Senator Russell Long.  I wondered what happened to this project.  I investigated the Corps and project in the Times-Picayune and States Item.  To my amazement, I discovered that the project was halted by the Federal Court in New Orleans.  It seems a lady from Uptown New Orleans sued the Corps over Environmental issues.  In 1977, the court ruled in favor of the lady.  The Corps goes to congress for relief, and Congress told them basically to maintain the status quo.   I feel that Congress  and our legislators hold more responsibility than the Corps.  As a side line, the swing gates shown in Holland were copies of the New Orleans Corps design developed after the 1967 act.  The Corps had actually started construction Rigolets.  As I stated, all this information was gleamed from the two local papers at that time.  Too bad we did not have a Hale Boggs or Russell Long to push through the projects that effected our area after Hurricane Betsy.  I know for a fact I would not been flooded if the Rigolets swing gates were in place and the twin span bridge would probably not been destroyed.</p>\n"
- id: 493
  parent: 0
  author: "S. Rosenthal"
  author_url: ""
  avatar: "c1708ec2c48751034e1a20aa4ad5a1f9c8196c02275e80e3afe45326354b7311"
  date: "2008-12-17T11:51:34"
  content: "<p>Dear Mr. McKight,</p>\n<p>I am just a citizen, but I can read, and so I decided to read federal Judge Stanwood Duval&#8217;s January 30, 2008 statement on this very issue:</p>\n<p>1970-75 The Corps of Engineers designed plans for barrier structures for The Rigolets, Chef Menteur Pass and the Seabrook lock.  On Dec 8, 1975, Luke Fontana (definitely not an uptown lady) with Save our Wetlands filed suit against Barrier Plan, which triggered its eventual abandonment.  On Dec 7, 1977, the Court prohibited the Barrier Plan implementation &#8220;citing inadequacies in the District EIS [Environmental Impact Study] analysis of the surge barrier effects on lake salinity regimes and habitat.&#8221;  Four months later, levees and floodwalls were allowed elsewhere in the New Orleans vicinity, but Chef Menteur Pass, the Rigolets, and the Seabrook Lock was prohibited.  Fast forward to Apr 1978 – Feb 1980  The Corps “approved the project restudy plan” to spend 3 years addressing deficiencies in Environmental Impact Study.</p>\n<p>Finally, in June 1980, the Corps concluded High Level Plan (higher levees) providing SPH protection, was less costly, less damaging to the environment, and more acceptable than the Barrier Plan.</p>\n<p><a href=\"http://graphics8.nytimes.com/packages/pdf/national/20080130_Dismissal_Order.pdf\" rel=\"nofollow ugc\">http://graphics8.nytimes.com/packages/pdf/national/20080130_Dismissal_Order.pdf</a></p>\n"
- id: 494
  parent: 0
  author: "Bruce Biles"
  author_url: "http://noladder.blogspot.com/"
  avatar: "cb17c73b9440a1f03f8cf74b61cf60f9e08c218905a4f3e075044f5e7a4a0349"
  date: "2008-12-17T15:41:24"
  content: "<p>Mr. McNight,<br />\nthank you for such a salient piece of innuendo.<br />\nIt is about time someone came onto this blog with the intellectual fortitude to address Ms. Rosenthal&#8217;s concerns about, shall we be charitable here, the Corps of Engineers less than honorable &#8211;though no less ambitious&#8211; tactic of re-framing and re-telling the story of the abject failure of their own Engineering on August 29th, 2005.</p>\n<p>That is the point of the post.</p>\n<p>Not, as you by False Analogy cloddishly assert, Ms Rosenthal&#8217;s litigiousness proclivities.</p>\n<p>Hence, she demolished your faux curve-ball salient innuendo<br />\n&#8211;with Sworn Court Testimony.<br />\nDemolished it. Really.<br />\nExquisitely well done and with all the poise of an uptown lady.<br />\nAnd I wait on baited breath to see your retort!<br />\nI can&#8217;t see it, and that is half the fun.</p>\n<p>You see, I was here for the Federal Flood, when the Corps of Engineers&#8217; Flood Control System (in name only) Failed. 6 days.<br />\nSo, you see, I caught a dark sense of humor during those unsilent nighjts about these types of discussions: as to what went down and why, as well as now, what is going down and why. What&#8217;s that Sound?</p>\n<p>Did you hear any of those levees break, btw, Robert?<br />\nWhat&#8217;s that Sound that&#8217;s Going Down.</p>\n<p>Really. The Corps of Engineers is attempting to Lie on Ms. Rosenthal&#8217;s blogs.<br />\nThey came on My own blog and Lied.</p>\n<p>This isn&#8217;t about whatever you were getting at, with your False Analogy, &#8216;begging the question&#8217;, also called petitio principii, in which the proposition to be proved is assumed implicitly or explicitly in one of the premises<br />\n&#8211;or the resultant back-hand, ad mominem attack.<br />\nIt won&#8217;t work, because Ms Rosenthal deals in data, facts, and in this case, web shots of these criminals doing exactly with she is posting about.</p>\n<p>And so you offer&#8230;this. And she retorts.<br />\nDose not call you on your fallacies which would&#8217;ve costs you at least 15 points in a debate.<br />\nHow mannered. How well bred. How&#8230;<br />\nLady&#8217;like.<br />\nWish I knew where this Lady lives&#8230; Uptown maybe???</p>\n<p>And you stand with your pants down,<br />\ndemolished by Sworn Court Tesimony &#8211;given by Engineers!<br />\nI find that hysterical!</p>\n<p>So I am not here to jump into Y&#8217;alls discourse!<br />\nIt is your turn. Please, since you now as far as I can see, have Nothing please please please tell us&#8230;<br />\nWHO IS THAT UPTOWN LADY???<br />\nHAHAHAHAHAHAHAHAHAHAHAHAHAHA<br />\nOh that is Rich!<br />\nSalient Innuendo and Out the Other!<br />\nHahahahahahaha<br />\nYes, Robert, I like to laugh like a Rhesus Monkey.<br />\nAnd I will dance on the Exquisite Corps!<br />\nHahahahaha! WHO&#8217;DAT???<br />\nWHO&#8217;DAT LADY GONNA BEAT DEM&#8217;CORPS?</p>\n"
