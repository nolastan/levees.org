  avatar: "00297c7b98f3940413035aa6ccfb90977bc8a927fb4333162ca5e0e8f3935a66"
  date: "2008-12-17T21:46:42"
  content: "<p><a href=\"http://www.swbno.org/history_drainage.asp\" rel=\"nofollow ugc\">http://www.swbno.org/history_drainage.asp</a></p>\n<p>FOR  Our Future Record &#8211;</p>\n<p>WHO built the FLOOD CONTROL Dam &amp; Lock at St. Bernard Ave.  and Beauregard Street</p>\n<p>(this is a statement of FACT FINDING)</p>\n<p>WHY didn&#8217;t the City  which paid for it&#8217;s Construction and Permitting have the COMMON SENSE and money to build an exact replica at mouth of 17 St. Canal ?</p>\n<p>Go Figure.</p>\n"
- id: 510
  parent: 0
  author: "LEAKERIVER Rd."
  author_url: ""
  avatar: "00297c7b98f3940413035aa6ccfb90977bc8a927fb4333162ca5e0e8f3935a66"
  date: "2008-12-17T21:58:05"
  content: "<p>SELA PROJECTS dates to 1997 &#8211; 1998 Hurricane Season.</p>\n<p>How about accepting New Orleans City Hall Administration and O.L.D. and<br />\nstate LA. Legislature and NOLA S&amp;WB for all being complacent and willfully Obstructing USACE reports and findings, albeit sometimes faulty.</p>\n<p>We also know who saved the Crescent City&#8217;s EXISTENCE in 2008 during Gustav.<br />\nnow, don&#8217;t we all feel smarter.</p>\n"
- id: 508
  parent: 0
  author: "Sandy"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2008-12-18T09:09:22"
  content: "<p>Mr. Leakeriver, let&#8217;s not repeat unsubstantiated myths.</p>\n<p>The City cannot and does not build its flood protection.  Responsibility for the design and construction of the Lake Pontchartrain and Vicinity Hurricane Protection Project (LPV) has belonged solely to the USACE since 1965.  This is federal law.</p>\n<p><a href=\"http://en.wikipedia.org/wiki/Flood_Control_Act_of_1965\" rel=\"nofollow ugc\">http://en.wikipedia.org/wiki/Flood_Control_Act_of_1965</a></p>\n"
- id: 511
  parent: 0
  author: "Infowars Reader"
  author_url: ""
  avatar: "9d66d92b267665b74b6a0943be9f06c7c91e56ca4b181413780e7bf54f743f75"
  date: "2008-12-18T10:19:31"
  content: "<p>Saw your vid. linked on Infowars.com&#8230;. Oh please.  If the citizens of N.O. had actually used the money that had been alocated over the last 30 years for levee building and flood control, instead of lining the pockets of their corrupt politicians, they would have had a world class levee system.  Instead, they used it to grease the wheels of their own corrupt system.  The people of N.O. got exactly what they deserved for their lack of foresight.  Oh ya, thats right, I forgot&#8230; Bush attacked N.O. with Katrina &amp; Rita lol.  &#8220;Never attribute to malace what can be attributed to stupidity.</p>\n"
- id: 512
  parent: 0
  author: "Sandy"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2008-12-18T18:04:33"
  content: "<p>Dear Infowars Reader,</p>\n<p>Please lets not repeat myths unfounded myths.  The citizens of New Orleans cannot line the pockets of their politicians with federal levee money.  That&#8217;s because the entity controlling federal levee money belongs exclusively, via the Flood Control of 1965 to the US Army Corps of Engineers.</p>\n<p><a href=\"http://en.wikipedia.org/wiki/Flood_Control_Act_of_1965\" rel=\"nofollow ugc\">http://en.wikipedia.org/wiki/Flood_Control_Act_of_1965</a></p>\n"
- id: 513
  parent: 0
  author: "Two Sides"
  author_url: ""
  avatar: "c89eae22a697edc942b51366cf978d59f6da15d69ec6cb939d9013c1d688a2a2"
  date: "2008-12-18T18:38:09"
  content: "<p>Sandy, you need to read the reference which you provide, under Basic Provisions, it is no myth, &#8220;Any such project was subject to local cost sharing&#8230;&#8221; For levees to be built correctly, Congress needs to make all levees Federal so that what ever costs it takes to construct what the Corps&#8217; civilian engineers that reside behind the levee protection design, can then be built.</p>\n<p>I believe what the other posters are referring to is the fact that the Corps&#8217; engineers designed flood protection that would have avoided the catastrophe of Katrina. However, being constrained by the Flood Control Act, the local government could not match the costs required to build what was needed. In addition, property owners adjacent to the canals complained to their representatives when they found out they would have to sell part of their property to construct the flood control system with an adequate footprint. The represenative/s petitioned Congress and disallowed the corps to design the required protection that the engineers proposed.</p>\n<p>I do not know about lining pockets, but I do know that locals held the Corps hostage in requiring the Corps to use inferior pump equipment and machinery available from companies connected to local politians; if the corps did not buy the machinery, they would with hold their cost share portion.</p>\n<p>The goal of Levees.org to demand safe levees and the protection of citizens is a much needed organization. However, if they rest their hat on everything being the Corps&#8217; fault and ignoring the fact that while the Flood Control Act requires local cost sharing, the designs required will be hard to make it to construction. In essence, in putting all of its eggs in the Corps basket, it is severely handicapping itself in uncovering the full truths and helping develop an actual solution.</p>\n"
- id: 514
  parent: 0
  author: "Sandy"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2008-12-18T19:31:21"
  content: "<p>Dear Two Sides:</p>\n<p>Prior to Hurricane Betsy, the local government in south Louisiana designed and built their own flood protection.   That all changed with the Flood Control Act of 1965.</p>\n<p>Please provide the evidence that the local governments “disallowed the corps to design the required protection that the engineers proposed.”  Levees.org has been looking for that evidence for a year, have not found it, and don&#8217;t believe it exists.  We welcome you to show it to us.</p>\n<p>Please provide evidence that “locals held the Corps hostage in requiring the Corps to use inferior pump equipment and machinery..”</p>\n<p>In closing, yes, the Flood Control Act requires cost sharing. That&#8217;s the way it is for all Corps of Engineers flood protection projects in all states.  That is the way Congress wants it.  That is law.</p>\n"
- id: 515
  parent: 0
  author: "MJ"
  author_url: ""
  avatar: "cfb53e683ef9b6535d4322e9c7d84cca31af6a48b7324cd03eb54d8af0025b6a"
  date: "2008-12-20T08:05:11"
  content: "<p>I am definitely with Infowars and Leakeriver on this Sandy. Having been born and raised in New Orleans and lived my entire life in Gentilly, I must say that, while I fault the Corps for the faulty levees, I have to place just as much if not more blame on the OLD, etc for not maintaining the levee system that was built for the City. Additionally, the 17th street canal was never a levee, it was nothing more than the dredge material that came from when the canal was originally built.</p>\n<p>Lastly, has anyone ever been to the public meetings the Corps holds? My mother and I went for out Lakeview/Gentilly homes and the number of people out there threatening the corps with lawsuits if they did not do what they were told by the citizens was enormous. It is amazing they can get anything done.</p>\n"
- id: 516
  parent: 0
  author: "Sandy"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2008-12-20T08:23:57"
  content: "<p>Dear MJ,</p>\n<p>Please let&#8217;s not repeat myths.  There is no evidence that any levees failed during Katrina due to lack of maintenance by the Orleans Levee District (OLD).  Zero, zip, nada.</p>\n<p>Further, the OLD can maintain only levees that are certified as complete.  When Katrina struck, 60-90% of the levee system was still incomplete and not slated for completion until 2015.<br />\n<a href=\"http://www.gao.gov/new.items/d051050t.pdf\" rel=\"nofollow ugc\">http://www.gao.gov/new.items/d051050t.pdf</a></p>\n<p>Ironically, the three outfall canals walls were complete, and the USACE has since taken full responsibility for bad design of those canal walls.<br />\n<a href=\"http://eng.auburn.edu/admin/marketing/seminars/2007/l-roth.html\" rel=\"nofollow ugc\">http://eng.auburn.edu/admin/marketing/seminars/2007/l-roth.html</a></p>\n"
- id: 517
  parent: 0
  author: "MJ"
  author_url: ""
  avatar: "cfb53e683ef9b6535d4322e9c7d84cca31af6a48b7324cd03eb54d8af0025b6a"
  date: "2008-12-20T08:42:12"
  content: "<p>Actually Sandy, you should read the investigation performed by Dr. Shea Penland of the University of New Orleans after the flood. The levees were indeed suffering from maintenance issues. Since the LOCAL sponsor is supposed to take care of the sections of the levee after the section is complete, I think you really need to reexamine your facts. While the levees were not slated for full completion until 2015, it was STILL the responsibility of the local sponsor to take care of that which was complete.</p>\n<p>Now, after the storm, there were several trucks along the levee that were not there for repair. They were there to test the levee stability and they found that settlement and lack of maintenance meant that those levees needed to be repaired before they failed.</p>\n<p> As fir the links you provided, thank you, but they say nothing. I do not trust the &#8220;findings&#8221; of out of town &#8220;universities&#8221; that have never set foot in this state and have no clue what a barrier island is. Look into Shea Penland&#8217;s research if you want real facts.</p>\n"
- id: 518
  parent: 0
  author: "Sandy"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2008-12-20T09:27:27"
  content: "<p>Perhaps you will trust Dan Hitchings, Task Force Guardian of the US Army Corps of Engineers.  Below is text from a conversation that took place at USACE headquarters in Feb 2006, printed with his permission.</p>\n<p>Levees.org: There is confusion about who is responsible for what regarding our flood protection in Greater New Orleans.</p>\n<p>Dan Hitchings: It’s very simple.  We are accountable to Congress and to the American people for the final product.</p>\n<p>Levees.org: What did the Levee Board do wrong?</p>\n<p>Dan Hitchings:  There are many investigations on going at this time, and the findings are not complete.  But, I am not aware that they did anything wrong that was significant.</p>\n<p>Three studies, the ILIT, Team Louisiana and the IPET all concurred.</p>\n<p>&#8212;<br />\nRegarding Dr. Penland&#8217;s research, please provide a link to the text where Dr. Penland proves that lack of levee maintenance caused catastrophic flooding.  We would love to see it.</p>\n"
- id: 519
  parent: 0
  author: "MJ"
  author_url: ""
  avatar: "cfb53e683ef9b6535d4322e9c7d84cca31af6a48b7324cd03eb54d8af0025b6a"
  date: "2008-12-21T07:45:56"
  content: "<p>Sorry Sandy, but you are sitting here telling us NOT to trust the Corps and now you are saying that we should trust something that they are saying. I don&#8217;t get it.  How do we know that they are not just taking the high road? You are telling me to trust this guy from Task Force Hope, but the comments you posted really say nothing and the quotes are from almost 3 years ago. C&#8217;mon! What is one supposed to believe here? The Corps is telling the truth only when they take full blame for something? Do we only trust them when they take the full blame? Not a very good way to get to the bottom of something.</p>\n<p>As for Dr. Penland, I studied with him at UNO and was one of the fortunate ones to do so before he passed away. For 30 years he led the alarm on coastal land loss and he introduced many of us to the Pontchartrain Institute for Environmental Science. You can find a lot of his research there.</p>\n"
- id: 520
  parent: 0
  author: "Sandy"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2008-12-21T10:51:50"
  content: "<p>Dear MJ,</p>\n<p>Our mission is education, and our goal is the 8/29 Investigation Act.</p>\n<p>You mentioned you didn&#8217;t trust the work of University personnel if they are not from Louisiana.  So I provided other testimony.  And I was transparent about the date.</p>\n<p>Please show us the text in Dr. Penland&#8217;s research that proves that lack of levee maintenance by the OLD led to catastrophic flooding in New Orleans.  We would like to see it.</p>\n"
