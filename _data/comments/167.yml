  author_url: ""
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2009-08-27T12:40:39"
  content: "<p>Note from Founder to Aurora Green:</p>\n<p>When Levees.org states that no levee failures were due to maintenance, we are referring to levees that failed on August 29, 2005 in the Lake Pontchartrain and Vicinity area.</p>\n"
