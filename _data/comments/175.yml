- id: 568
  parent: 0
  author: "Sandy Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2009-04-11T12:19:58"
  content: "<p>The email below sent to me &#8211; and me only &#8211; is a copy and is unaltered in any way.  Mr. Boutwell was responding to 2 questions I had asked verbally.  1)  How how much money did the American Society of Civil Engineers receive from the US Army Corps of Engineers to complete its peer review, and 2) what was his opinion of the peer review report (ERP) and the accompanying press release.</p>\n<p>From: Gordon Boutwell<br />\nDate: Jun 20, 2007 2:41 PM<br />\nSubject: Re:<br />\nTo: Sandy Rosenthal</p>\n<p>Sandy:</p>\n<p>Sorry to be so late getting back to you, but my paying customers also wanted my time. I understand that the $2 million was for the entire External Review Panel (of ASCE) work over some 20+ months, not just for the report. The ASCE/ERP report &#8220;What Went Wrong and Why&#8221; is not part of the IPET report. In fact, the ASCE/ERP report covers areas that were not in the USACE assignment.</p>\n<p>For your information, the latest issue (June 2007) of ASCE&#8217;s monthly magazine &#8220;Civil Engineering&#8221; has a 10-page article on the ASCE report. It more closely captures the real spirit of that report as opposed to the Press Release &#8220;spirit&#8221;.</p>\n<p>As for the ASCE/ERP report itself, I am in basic agreement with it. Of course, there are some points on which I would disagree, and with which at least one ERP panelist disagrees, but overall the report is quite satisfactory.</p>\n<p>The Press Release, however, is another matter.  All three of the Times-Picayune&#8217;s criticisms of the Release are correctThe Release often calls what I consider proven facts as &#8220;Perceptions&#8221; to be debunked. For example:</p>\n<p>Katrina was a CAT 3 &#8211; the Release writers use the surge level on the Mississippi Coast in an attempt to maximize the Storm. Totally irrelevant to New Orleans.</p>\n<p>No Levee Failures, No Devastation. The Release writers claimed that the rainfall and surge overtopping (without breaching) would have devastated the City. You won&#8217;t find this claim in the ERP report. Sorry, but N.O. had two rainfall events in the preceeding 10 years that exceeded Katrina&#8217;s rainfall.</p>\n<p>No Malfeasance. This was in the IPET (USACE) report but I didn&#8217;t find such a statement in the ERP report. Rather, the ERP report attributes failure to &#8220;questionable engineering and management decisions&#8221;; these could be found to rise to the level of malfeasance. As for the construction contractors, I&#8217;ve seen nothing to indicate substandard work or collusion, no &#8220;malfeasance&#8221;.</p>\n<p>Overall, I found the Press Release selective; that is parts contain the truth but not the whole truth. Its objective appears to be exoneration of the designers from any responsibility. I am proud of ASCE for publishing the ERP report and the cited article. The Press Release makes me ashamed for my Society.</p>\n<p>Gordon</p>\n"
