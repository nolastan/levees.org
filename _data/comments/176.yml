  content: "<p>Len Bahr said all that needs to be said.</p>\n<p>For what little it&#8217;s worth, I added my protest yesterday here:</p>\n<p><a href=\"http://revolution-21.blogspot.com/2009/04/killing-cassandra.html\" rel=\"nofollow ugc\">http://revolution-21.blogspot.com/2009/04/killing-cassandra.html</a></p>\n<p>This whole episode is shameful but, alas, I have come to expect no better from my home state or college alma mater. I have informed LSU that it has gotten its last dollar from me.</p>\n"
