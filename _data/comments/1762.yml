  content: "<p>To expose the usace as the inempt organization they are nonetheless does little to force them to build levees that do not fail. Just as recently uncovering construction debris installed as levee clay, and, the absurd notion that grass and rock qualify as &#8220;amour&#8221;, just furthers the need to design/construct for flood prevention not the never ending excuses by repeating the ongoing mistakes of the past. Only through the private sector can the true problem of building long term safe and reliable levees be solved. Wishful thinking!</p>\n"
