  content: "<p>Those Corps of Engineers emails made for some interesting reading.  I got a kick out of it when one of them made fun of the comment &#8220;We are Winning&#8221;&#8230;The corps person states &#8220;I didn&#8217;t know it was a competition&#8221;  Folks, it is in fact a competition.  It&#8217;s a competition between the Corp&#8217;s lies, spin, dis-information in the form of their &#8216;PR&#8217; work and their dysfunctionality versus the truth.  And YES, thanks to Levees.org, Judge Duvall and many others who are fighting for the truth&#8230;the truth is winning!</p>\n"
