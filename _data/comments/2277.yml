  content: "<p>You got dat&#8217;right Roy! Ha!<br />\nAnother fav of mine is the one where they say, &#8220;I&#8217;m winning&#8221;!<br />\nHahahahahaha&#8230;whew!<br />\nThe Corps already has a Public Affairs Dept, soooo why do they need for We The Tax Payers to pay all this extra cash to another Public Relations Dept?<br />\nAnd now they want to We The Tax Payers to Pay More Again and Again just to see our own records of this work we have already paid Optimal Process Partners???<br />\nExcuse me????<br />\nWe Own This Work by OPP. We Own It.<br />\nWhy should we have to pay the Corps of Engineers AGAIN here?<br />\nIsn&#8217;t like Double Taxation or something?</p>\n"
