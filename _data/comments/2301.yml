  content: "<p>Thank you so much for doing this report in the face of what is arguably NOT reporting on the part of Sheila Grissett.<br />\nIf we just had her version of events, as we have had to suffer this past year, then we would never have know about the context behind the spin statement &#8220;Isolated Incident&#8221; and we would not have seen how she and the Corps/OPP capitalized on and misappropriated Ligi&#8217;s comment about her breaking the story. She sucked it up too didn&#8217;t she and never said a word. HA! What a Scoop&#8217;Ho fo&#8217;da&#8217;Co! </p>\n<p>Finally, most people don&#8217;t realize the roll these PR Ho&#8217;s at OPP are controlling these meetings and thus the message in the Times-Picayune through their poodle Grissett. Her getting embed with the Corps is getting unseemly.</p>\n<p>You should write more, this is a nice piece.<br />\nThanks again.</p>\n"
