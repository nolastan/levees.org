- id: 3309
  parent: 0
  author: "Dave Gaspard"
  author_url: ""
  avatar: "e1a2135b4849cc94e33d1720d7820977e7e996210a60f3311d6b850ed2d15a2c"
  date: "2010-02-10T21:03:51"
  content: "<p>Mr.Ivor van Heerden cared enough about us to stand up and speak out for all of the people living in and around south Louisiana. With all due credit to Levees.org, his credentials made his words all the more credible and helped to shine a spotlight on an issue that has been long ignored. He did this even though he must have known that it would risk the comforts and securities of his own professional/personal life and that of his family and that&#8217;s exactly where he now finds himself. He spoke out anyway. Why? There was nothing to gain and everything to loose. Obviously, it&#8217;s because he genuinely cares.<br />\n  The very least we, the people of south Louisiana could do, is reciprocate, maybe by generating a petition, send emails, make phone calls, etc., SOMETHING for this man, in his time of need. We must do this. Our belief and faith in righteousness DEMANDS this.<br />\n  Can Levees.org lead the way with this effort? Our combined efforts have made a difference before.  There&#8217;s common ground for sure. And it would really be the height of hypocrisy for us to do anything less. This man deserves no less from us.<br />\nAfter all, it&#8217;s because of his concern for all of us that he finds himself in the position that he&#8217;s in today.</p>\n"
- id: 3311
  parent: 0
  author: "Jay Delhom"
  author_url: ""
  avatar: "26232b330c56dbbd76c91bf6b7d17bf82e03f1af0c342a6b5a964d95d4d7a877"
  date: "2010-02-11T03:35:52"
  content: "<p>Isn&#8217;t Louisiana an employment at will state?</p>\n<p>The man did not have tenure.  His employer could let him go without reason.</p>\n<p>He is not a victim of discrimination. Freedom of speech allows you say things without being prosecuted by the government.</p>\n<p>But if what you say embarrasses your employer, your employer can let you go, even if your job performance is great.</p>\n<p>LSU did not discriminate on race, sex, religion, age, sexual preference or any other legally protected criteria.  </p>\n<p>He has a PhD in geology.  He can speak as an expert on things pertaining to geology, such as the effects of subsidence on the geology of an area or the effects of errosion on the geology of an area.</p>\n<p>He is not an expert on civil engineering.  He was working at a university with a distinguished Engineering Department that has produced a large number of civil engineers. </p>\n<p>At least he only insulted donors.  If he insulted LSU sports, he would have been put in with Mike.</p>\n<p>Bon appetit Mike!</p>\n"
- id: 3312
  parent: 0
  author: "Jay Delhom"
  author_url: ""
  avatar: "26232b330c56dbbd76c91bf6b7d17bf82e03f1af0c342a6b5a964d95d4d7a877"
  date: "2010-02-11T04:49:36"
  content: "<p>Earlier I said right to work when I should have said employment at will.<br />\nLouisiana is both, but the second is the one  that allows and employer to dismiss an employee without cause or stating the cause as long as it does not conflict with federal or state laws against discrimination.</p>\n<p>Ivor van Heerden, PhD, was not fired to my knowledge.  His contract was simply not renewed.  A contract worker is not automatically renewed unless his contract so specifies. However, the contract usually gives an assurance of a period of employment.</p>\n<p>I do not know if his position was a tenure track position that either results in tenure or termination.  Tenure is frequently not the end destination in such a track.</p>\n<p>The LSU system has been forced to reduce many non tenured positions.  It seems we have so much money that we give away tax credits to make movies, but lack money for universities and the Charity Hospital system.</p>\n"
