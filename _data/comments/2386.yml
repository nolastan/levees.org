  content: "<p>I need to know how I can add my voice to the travesty on Dr. Van Heerden being fired!. I&#8217;ve never seen a more passionate and dedicated advocate for fixing the problem of insufficient hurricane protection along the Gulf Coast.<br />\nI suggest contacting Spike Lee, who interviewed the Dr. for his documentary. Let&#8217;s see if Hollywood can put some muscle behind this protest!!!!<br />\nMy daughter is a student at LOYNO, and I&#8217;ve long been a fan of the Dr&#8217;s., ever since we evacuated from Katrina&#8217;s path while at orientation for mu daughter&#8217;s college entrance. I live in Cleveland,Ohio<br />\nbut pay close attention to issues in NOLA.</p>\n"
