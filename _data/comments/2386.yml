  date: "2010-04-01T13:56:44"
  content: "<p>Since before 1986, I have TRIED to be an informant! I warned everyone within distance of my voice, including the FBI in New Orleans) that the Industrial Canal (and many other Levee sections) had been built with substandard materials and shoddy workmanship. I warned that the Levee in N.O. &amp; on down the Gulf Coast was going to collapse because of the greed &amp; corruption!  Contracts were bought &amp; sold. The CORE accepted bribes.  Construction co&#8217;s paid with kickbacks. Politicians &amp; officials got payoffs. I submitted evidence to Assistant US Attorney Curtis Collier. NOBODY had to die during a category 1 hurricane called Katrina! They could have been warned &amp; saved from destruction. I have suffered severe consequences due to my actions.  Yet NOBODY has been investigated that I named as conspirators in the destruction of the Levee. One more time, might I suggest that somebody question L Palmisano, T Demuye, and JW Fisher of the LB Foster Equipment Company (then on Marquette) about their knowledge &amp; involvement in corrupt schemes for which they got payoffs.  I went to Atty Jacqueline Carr who set up an appt between myself &amp; the FBI.  My atty Pat Hedges (her husband had connections to Levee Board) said SHUT UP or lose my kids!  Judge France Watts put me under a gag order to shut me up. Just ask Atty Tom Gray about all this stuff &amp; see if he lies to cover his shame of not acting appropriately to save thousands of lives? OMG, the guilt and shame that abounds there within local contractors, officials, and the Corps of Engineers! As for me, I hold the FBI and officials mainly responsible for the death, suffering, and destruction of New Orleans.  All the corruption could have been STOPPED way back in the 80&#8217;s when I submitted evidence and WARNED of the impending catastrophe! Now the Levee is still riddled with weak sections like a termite infested wooden structure &#8211; just waiting for a REAL category 4 hurricane.  OMG what horror awaits!  Find the people who know about the weak levee sections to ASK QUESTIONS! I only named a few, but there are many many more who have info that could save thousands and thousands of lives in the future! I am sick to hear all the defenses put up for or by the Corps of Engineers!  They massacred New Orleans and murdered children. Yes I sound outraged and justifiably so!</p>\n"
