  content: "<p>If it is not possible to sue the Federal Government, What can be read in that fact? There is no accountability, The Government can tell you that the actions they perform are for your own good and are done with your best interest at heart, but when something goes wrong all they can say is &#8220;We Are Sorry&#8221;. You can&#8217;t sue them, so therefore there are no penalties for the actions of our Government. People have to wake up to the fact that we have a Government out of control, ruled by the Money interest of big banks, Wall Street, and big corporations. Our politicians, from small Government to big Government are being corrupted by Money.</p>\n"
