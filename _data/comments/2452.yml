  content: "<p>(Damages paid to local governments and residents will exceed $1 billion.)</p>\n<p>Mr Carville is incorrect here about the damages to plaintiffs.<br />\n[ In the short run, Duval&#8217;s ruling could force the federal government to pay roughly $700,000 in damages to a small group of people and businesses.]<br />\n<a href=\"http://bestofneworleans.com/gyrobase/Content?oid=oid%3A67710\" rel=\"nofollow ugc\">http://bestofneworleans.com/gyrobase/Content?oid=oid%3A67710</a><br />\nThose are the Facts and hopefully Mr Carville can get them straight as the Federal Government wrestles with where OR NOT to settle with the plaintiff&#8217;s in MR-GO.<br />\nI understand that Mr Carville may be speaking of POTENTIAL settlements, but in the realm of Legal Negotiations it is imperative that we keep our facts straight and not stretch the truth.<br />\nThere is nothing in the quoted statement above to distinguish this and no link to Carville&#8217;s article so I am only going on what you have posted here.</p>\n"
