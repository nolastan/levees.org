  content: "<p>I am soooo proud of Levees.org and their connection to this beautiful film.<br />\nPlaying the &#8220;Graceful Card&#8221;, Y&#8217;all aren&#8217;t saying it all here so I will.<br />\nAfter viewing the Nola premier of this masterpiece at the Levees.org Anniversary Soiree, Matt Faust told me to my face that Sandy Rosenthal had pushed him and encouraged him the whole way to entering the bigger film festivals and getting this fine piece to a wider audience. His words were (something to the effect of:) Levees.org showed him just how &#8220;Not Alone&#8221; we are no matter how much was taken away.</p>\n<p>So Hats off to Matt,<br />\nand Big Thanks Youz to Levees.org!<br />\nTo quote our fearless leader from the bottom of all her emails:<br />\nWe Are Winning.</p>\n"
