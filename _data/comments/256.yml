  date: "2014-06-14T18:20:06"
  content: "<p>Dear Uncle Joe,</p>\n<p>We are not aware of any record or documentation that the Corps warned the N.O. govt that the levees were inadequate. If you have such data, we would dearly love to see it. </p>\n<p>Sandy Rosenthal<br />\nFounder of Levees.org</p>\n"
