  author: "Uncle Joe"
  author_url: ""
  avatar: "0baddcc00f5ed19d9477565fc246eb9960310a902659249e96863df2f9b247da"
  date: "2014-06-14T17:40:48"
  content: "<p>The US Army Corps of Engineers warned the New Orleans government that the levees were inadequate. Every year, the New Orleans government would use this to justify asking Congress for an allocation to fix the levees, and every year the Congress would approve the extra money. And every year, the New Orleans government would misappropriate the funds to something else. In the year before Katrina hit, they spent the money on bike paths.</p>\n<p>There has been a brilliantly clever attempt here to cast blame away from Democrat officials, especially in the city itself, and onto the USACE. If only this sort of dedication had been applied to heeding their warnings, instead of lining the pockets of Democrats and their friends. Unfortunately, favorable spin won&#8217;t protect the city from the next Category 5 hurricane.</p>\n"
