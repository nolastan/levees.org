  content: "<p>MOVE BEYOND SOUND-BITES AND ARMCHAIR THEORIES TO MAKE THE NATION SAFER FROM DISASTER</p>\n<p>In the name of being fair, I thought people who read this blog might want to know what else the ASCE had to say in their report.  Here is the link to their news release.</p>\n<p><a href=\"http://www.asce.org/pressroom/news/display_press.cfm?uid=3390\" rel=\"nofollow ugc\">http://www.asce.org/pressroom/news/display_press.cfm?uid=3390</a></p>\n<p>It talks about fact and fiction, the commonly held misperceptions related to Hurricane Katrina.  I hope this information helps your readers form a more educated/informed opinion.</p>\n"
