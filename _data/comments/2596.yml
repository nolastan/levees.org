  content: "<p>Yay!<br />\nCongratulations Ezra and Levees.org!<br />\nThat paper is such a good solid piece of work. And as well, the results remain incontrovertible and unassailed in any of the comments sections I&#8217;ve seen on the paper. Some may offer their opinion, but none have been able to dispute Ezra&#8217;s findings from the data presented.<br />\nPlus, everyone is just Jealous As Hell of that Map!<br />\nWe hope Y&#8217;all make a Poster of it.<br />\nI&#8217;ll hang it on my living room wall, right next to the one I have that your son made &#8220;Together We Can Rebuild&#8221;.<br />\nLevees.org: Artifacts Not Politics.<br />\nThanks again, Y&#8217;all.</p>\n"
