  content: "<p>We should promote those of us with great talent and the strength to speak truth to power regardless of the consequences.  Prof. van Heerden&#8217;s position was based on merit and I believe his firing was based on politics.  This is a disgrace against LSU and perpetrated against the people of this area, particularly his future students.  We cannot begin to repay his work to protect Louisianans and all those whose path hurricanes and floods will cross.  This simple gesture to stand up for him and justice is the limit of my power.  I hope those in high places will also stand up for him.</p>\n"
