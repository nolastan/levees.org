  content: "<p>Ma&#8217;am, why do engage in the same activity that you accuse the Corps of?</p>\n<p>Rather than play this in the media for your own political gain, for a cause that is clearly on life support, why not call the Corps and meet with them to get an answer?  You only manage to resurrect yourself when you feel you aren&#8217;t getting any attention for your &#8220;cause.&#8221;  You&#8217;ve done almost as much to delay the recovery of this great city and its people as the mayor.</p>\n<p>BTW, what happened the Friday CBS News story?</p>\n<p>Also, the AP reporter has his facts wrong, as he normally does.  But when has accuracy been any interest to you?</p>\n<p>Carter Slade</p>\n<p>PS &#8211; Just in case you decide not to post this, I&#8217;m sending it to my email list of ~10,000 that includes all the major broadcast networks around the world.  Be prepared to answer the tough questions coming your way.</p>\n<p>CS</p>\n"
