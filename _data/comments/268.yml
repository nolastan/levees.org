  date: "2009-05-09T10:46:05"
  content: "<p>Here you go, Carter:<br />\n<a href=\"http://www.cbsnews.com/stories/2008/12/16/cbsnews_investigates/main4672316.shtml\" rel=\"nofollow ugc\">http://www.cbsnews.com/stories/2008/12/16/cbsnews_investigates/main4672316.shtml</a></p>\n<p>As levees,org seems more to represent the antibody politic, what political gain?<br />\nNo one has done more to delay answers to the Corps of Engineers&#8217; catastrophic civil engineering failures on 8/29/05 than the Exquisite Corps its own self &#8211;with the help of paid professional spin&#8217;filtraitors.<br />\nWhile We the People have nothing but recovery and survival of their substandard engineering.</p>\n<p>To what &#8220;facts&#8221; do you refer?</p>\n<p>May I have the name of your pharmacist? Are they on your vaunted mailing list?</p>\n"
