  content: "<p>Dear Carter,</p>\n<p>I have had to stand up to power.  I will tell you it&#8217;s very hard.  I have had to deal with a lot of very bad stuff.  If not for some brave souls from the media, I might have gotten nowhere.</p>\n<p>Thank you Cain Burdeau of the Associated Press, to Pia Malbran of CBS News and to Georgianne Nienaber of the Huffington Post for helping me get this important message into the national news.</p>\n<p>Thank you Cain, Pia and Georgianne for helping to give me a voice.</p>\n"
