  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2009-06-06T17:54:52"
  content: "<p>Dear Jessica,<br />\nThe first CoDel was Jan 2006.  Levees.org, only recently launched, wasn&#8217;t invited, but I know they focused on the large perimeter barrier structures in Holland.  These barriers are not unlike the structure the Corps of Engineers is now building east of New Orleans that will be finished by 2011.</p>\n"
