  author: "Frans Stappers"
  author_url: ""
  avatar: "2e18f90bac752ab599543f1bb626727686b4d9f02f5f9facab2e283ee11b8ade"
  date: "2009-05-18T16:22:57"
  content: "<p>I was born, educated and started my profession in Rotterdam. Thus until I moved away I lived &#8220;with&#8221; levees. Nothing special.<br />\nThis is the 2nd time the powers to be go at tax payers expense to look at<br />\nthe Dutch protection system since early 2006, when I was there to visit family.<br />\nIf they learned nothing then, they will not learn anything new now;  the system in Holland has not drastically changed since December 2005.<br />\nThe only thing I can add is that in Holland politics do not play an important role when it comes to protecting the majority of the population against flooding.<br />\nSincerely,<br />\nFrans Stappers</p>\n"
- id: 602
  parent: 0
  author: "Sandy Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2009-05-18T17:56:25"
  content: "<p>Dear Frans,</p>\n<p>First, all of the invited guests &#8211; including me &#8211; are paying their own airfare and lodging.</p>\n<p>Second, this is CoDel Two, and will focus on a different set of objectives than the first trip.  This is not a repeat of CoDel One.</p>\n<p>If you have input you believe I should know, please write to me.  <a href=\"mailto:sandy@levees.org\">sandy@levees.org</a></p>\n"
- id: 595
  parent: 0
  author: "HeidiHoe"
  author_url: ""
  avatar: "fb6a8fd57fb34249a1bf2017d38d141134309ab794fdf5c3dfc2df608445051c"
  date: "2009-05-19T18:10:54"
  content: "<p>Frans hit the nail on the head, regarding the role of &#8220;politics&#8221; in all this.</p>\n<p>One of their concepts is the &#8220;polder system,&#8221; which will be interesting to see actually executed in New Orleans.  My guess it will become a &#8220;polder vs polder battle&#8221; instead of Lower 9th Ward, Lakeview, Plaquemines, etc&#8230;.</p>\n<p>No matter how the lines are drawn there will be turf battles I&#8217;m guessing.</p>\n<p>I&#8217;d be interested in seeing a &#8220;storm parameter comparison&#8221; and a &#8220;physical setting comparison&#8221; between the New Orleans and Dutch settings.</p>\n<p>Compare such things as:</p>\n<p>1.  Storm surge design height&#8217;s</p>\n<p>2.  Maximum wind speeds during design storm</p>\n<p>3.  Wind direction for design storm</p>\n<p>4.  Precipitation during design storm</p>\n<p>5.  &#8220;Depth to bedrock&#8221; in both locations</p>\n<p>6.  Dike construction (do the Dutch use &#8220;floodwalls&#8221; or earthen berms?)</p>\n<p>7.  Critical storm period (summer, winter, etc)</p>\n"
- id: 601
  parent: 0
  author: "HeidiHoe"
  author_url: ""
  avatar: "fb6a8fd57fb34249a1bf2017d38d141134309ab794fdf5c3dfc2df608445051c"
  date: "2009-05-20T08:11:27"
  content: "<p>The reason for my wanting a &#8220;side by side&#8221; comparison of some of the technical aspects of New Orleans situation and the Dutch situation is echoed in Part II of an ongoing three part posting at LACOASTPOST.COM; where one storm is referenced as a &#8220;wolf at the door&#8221; and the other as a &#8220;tame puppy.&#8221;</p>\n<p>I understand (and would like to confirm) that the &#8220;Dutch 10,000 surge elevation&#8221; (height) is roughly equal to that of the New Orleans 100 to 500 year storm surge elevation.</p>\n<p>Is this indeed true????</p>\n<p>Seems like the Gulf&#8217;s warmer storms would indeed have more strength than the cooler North Atlantic storms.</p>\n<p>Is this true????</p>\n<p>How exactly do they compare????</p>\n<p>This would be extremely useful information to either publish here now or to bring back from your trip and publish here.</p>\n"
- id: 596
  parent: 0
  author: "Sandy Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  date: "2009-05-20T13:22:31"
  content: "<p>HeidiHoe, you&#8217;re right this stuff is not intuitive.</p>\n<p>People might naturally think that 1,000 year protection for metro New Orleans requires 10 times higher levees than 100 year protection and is 10 times as expensive.  Not so.  In fact, it is a difference of only about 3 feet of levee height.</p>\n<p>I addressed this also in LACOASTPOST.COM</p>\n<p>Poldering is a wise idea as well, and is already part of planning dialog in New Orleans.  Very likely it may become a household word soon in south Louisiana.</p>\n"
