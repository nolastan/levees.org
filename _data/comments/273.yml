  date: "2009-06-03T12:51:23"
  content: "<p>Thanks for sharing! I&#8217;m looking forward to learning more of the specifics. In the meantime, kudos to Levees.org for being involved in this process! It&#8217;s encouraging that the Army Corps of Engineers has embraced this opportunity to learn from the Dutch, who seem, in general, to view &#8220;coexistence&#8221; as a tenet of their culture. The U.S. has a bad habit of criminalizing the poor, which leads organizations like the ACE to act or fail to act without accountability when the poor are at risk. It will be healthy for the U.S. to move beyond arguments about socio-economics, so that we might get to the business of protecting our citizens&#8211;something the Dutch seem to inherently understand.</p>\n"
