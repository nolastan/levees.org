  content: "<p>I happened to see you on TV this evening justifying the drilling morotorium in the Gulf.  I have also seen on the news that this 6 month moratorium could cost the region 300,000 jobs and billions.  It was also stated that 1 out of 5 people in Lousiana depend on this indusrty.</p>\n<p>I concur that the oil spill is a disaster, but I strongly disagree with this extended moratorium.</p>\n<p>The irony of your, and others, argument supporting the need to halt all drilling is that one company continues to drill in the Gulf at a depth of 5000 feet and is drilling 2 new wells.</p>\n<p>And that company is BP.  So, why is it safe for them to drill and not safe for others to continue their operations.</p>\n<p>Answer&#8230;.politics.</p>\n<p>I would trust you and your listeners would reflect on the above facts, the safety of this industry for decades and that the livelihood of this region would not be kept at jeopardy by the political motives of this Administration to further its agenda with Cap &amp; Trade.</p>\n"
