- id: 4951
  parent: 0
  author: "Mr. Scribbles"
  author_url: ""
  avatar: "0d1551ed20d046a13342b9c99bc5713dfcbace91feee1387bf7ab758bfbd8960"
  date: "2010-05-06T11:08:43"
  content: "<p>I realize NOLA peeps are sensitive to this  issue, but I wonder if there was as much indignation when Exxon Valdez wasn&#8217;t called a &#8220;man-made disaster&#8221; or when earthquakes are called &#8220;natural disasters&#8221; even though the man-made buildings that collapse are the most common killer in earthquakes. I don&#8217;t think this is a big issue, considering how much federal money has indeed poured into the region (including NOLA). Whether you think the money has been spent wisely or not is another matter; but clearly there is no prevailing national sentiment that NOLA is just a place where people shouldn&#8217;t live. The article &#8212; which you don&#8217;t link to &#8212; also use the terms &#8220;domestic disaster,&#8221; &#8220;disaster&#8221; and, in reference to Valdez spill, simply an &#8220;accident.&#8221; Nobody has any problem with calling hurricanes and typhoons &#8220;natural disasters&#8221; when they hit and kill people in Third World crap-holes (even if in fact the calamity could be considered &#8220;man made&#8221; due to poorly build infrastructure). In effect: an oil spill is a natural disaster, unless you think cleaning up beaches; a hurricane is a natural disaster even if the damage to NOLA is caused by crappy infrastructure. Besides: who says human nature isn&#8217;t &#8220;natural&#8221; anyway? Ya&#8217;ll just need to chill out about this. The most important thing to realize is this: Nobody who matters is saying NOLA should sink into the Gulf because people shouldn&#8217;t live there. You are getting angry about a few fringe-y schmucks who have no lives who go online and blather about how NOLA should be allowed to sink into the Gulf. They don&#8217;t matter. Ignoring these mental midgets is the best thing to do. Again: follow the money and tell me that the rest of the country doesn&#8217;t care. BILLIONS have been spent &#8212; proof of otherwise. I like your organization, but can we please put to rest this stupid semantic debate that gets us nowhere?</p>\n"
- id: 4952
  parent: 0
  author: "S. Rosenthal"
  author_url: ""
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2010-05-06T12:12:16"
  content: "<p>Mr. Scribbles, thank you for your kind words, and we wish you were right.  But every day, new sources all over America are saying the flooding in New Orleans was a &#8216;natural disaster.&#8217;  Noted author John McQuaid points out that such talk conjures up thoughts of &#8216;what were those people doing living down there&#8217; and harms our recovery.</p>\n<p>Saying Katrina flooded New Orleans is like saying traffic broke the I-35 bridge.  You don&#8217;t see anyone going around saying that, because it&#8217;s silly.  </p>\n<p>Btw, we sure do have a link to the subject article.  It&#8217;s at the close of the blog post.</p>\n"
- id: 4955
  parent: 0
  author: "Mr. Scribbles"
  author_url: ""
  avatar: "0d1551ed20d046a13342b9c99bc5713dfcbace91feee1387bf7ab758bfbd8960"
  date: "2010-05-06T15:09:29"
  content: "<p>Sorry, I missed the link. I would say the analogy would be more fit if your analogy was comparing a tornado breaking a bridge that wasn&#8217;t built to acceptable standards. I just think making a big issue out of this silly article is superfluous to the bigger issue this organization represents. To me, the biggest offense of this article is trying to force the idea that this oil spill to be &#8220;Obama&#8217;s Katrina Moment&#8221; which it clearly is not. Also I don&#8217;t think anyone out there is arguing that the cause of the flooding was not failed infrastructure and carved up wetlands. There are trolls out there who denigrate New Orleans and whine about federal spending on stuff they don&#8217;t think is worth it. I don&#8217;t think its necessary to play wack-a-mole with these views. They eyes should be on the prize of keeping the heat on the issue of infrastructure failings and not how some people spin the issue. Anyhoo, keep it up, gang.</p>\n"
- id: 4956
  parent: 0
  author: "S. Rosenthal"
  author_url: ""
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2010-05-06T15:31:10"
  content: "<p>Dear Mr. Scribbles,</p>\n<p>Levees.org created its petition for two reasons:  1) The NYTimes routinely refers to Katrina BOTH generally and in New Orleans as a natural disaster, and 2) to give displaced New Orleanians an opportunity to respond to Mr. Brock&#8217;s assumption about them.</p>\n<p>Sadly, I am afraid many out there continue to say the cause of the flooding was not failed infrastructure and carved up wetlands.  Just 2 weeks ago, US Senator Byron Dorgan called the flooding in New Orleans the result of a natural disaster and declared the people of N.O. should thank the Corps of Engineer for fixing the levees post-K.  </p>\n<p>Again thank you for the kind words.  We won&#8217;t give up</p>\n"
