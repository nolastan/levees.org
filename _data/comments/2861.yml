  date: "2010-05-08T17:52:43"
  content: "<p>I used to live on the MS gulf coast, pre-Katrina. I am a land surveyor and have studied the practices of the U.S.C.O.E. While you&#8217;re video was &#8220;entertaining&#8221;, you did not go into why the levees failed. You did not share that the levees were poorly conceived and constructed, have been failing for years, that the failures caused the undercutting of them, and the the levee board has been squandering money instead of making repairs. The original Mississippi River levee system was constructed out of materials other than just dirt. The scouring effects of the river always undermine dirt levees. Through subsequent &#8220;repairs&#8221;, the levees lost their man-made sub-structures. Also, the COE has made gross errors in the contruction of seawalls that have helped to destroy wetlands that would have slowed the storm surge. The walls help erode natural shores that cannot maintain themselves in the back surf created by the walls. I might be willing to aid your organization, if you present all of the facts in a concise manner. It will take more historical research than just the past twenty years.</p>\n"
