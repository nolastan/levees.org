  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2010-05-08T18:24:33"
  content: "<p>Dear Mr. Langen,</p>\n<p>To which video are you referring?  Levees.org has created over 20 videos.</p>\n<p>And though there are mountains of well documented evidence that the USACE has badly designed and built levees in greater New Orleans, we know of no well documented evidence that any of the levee failures were due to lack of repairs.</p>\n<p>Yes, the original Mississippi River levees are T-walls and very good construction.    </p>\n<p>For a more indepth description of the levee failures please see FREQUENTLY ASKED QUESTIONS on the our homepage.  </p>\n<p>And thank you for your offer to aid our organization.  I look forward to hearing from you.</p>\n"
