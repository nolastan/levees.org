  content: "<p>Compressed Air Jet Oil Combustor </p>\n<p>Basic Idea</p>\n<p>Inject one or more jets of hot compressed air (say 500F and 3000 psi) into the oil stream as it leaves the break.<br />\nJust forward of the air jet is a high temperature igniter – say at 2500F.<br />\nThe oil-air mixture flowing over the igniter will “burn”, i.e. combine chemically just as if burning in air, forming carbon dioxide and water.</p>\n<p>This doesn’t stop the flow, but “cleans up” at the source. </p>\n<p>Advantages</p>\n<p>Oil is burned at the source before it becomes dispersed.<br />\nThe technology is relatively simple; one or more compressed air pipes, an electric supply for the igniters and one or more compressors.  </p>\n<p>Application to subsurface oil plume</p>\n<p>Reports have appeared indicating that a huge oil plume has formed below the surface – possibly due to the dispersants used.<br />\nCompressed air injection might “burn” some of this oil while it’s concentrated.</p>\n<p>Technical Notes</p>\n<p>1. Each liter of compressed air at 500F and 3000 psi contains over 100 times the<br />\n    oxygen of a liter of air at atmospheric pressure and 70F, so will “burn” a large<br />\n    volume of oil.</p>\n<p>2. High air density should promote effective “burning”.   This is a reverse “La Paz”<br />\n    effect.   La Paz Bolivia is the worlds highest capital (11,900 ft) and has an<br />\n    abnormally low number of fires due to the low air density.</p>\n"
