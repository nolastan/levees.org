  date: "2009-06-03T16:33:19"
  content: "<p>I read with great interest the email sent to me regarding a trip to the Netherlands to see how the Dutch constructed their system to live along side mother nature.  I remember after New Orleans was a wash in flood waters, members of the city council went to see this same structure.  Although, I asked my city council person &#8220;what happened&#8221; with the information gathered, and if New Orleans was going to consider a similar co-existence.  I never received an answer.  I still do not know what happened to all that &#8220;we are going to go for it, and if the Dutch can do it we can do it.&#8221;  </p>\n<p>I am not as hopeful as I once was living in New Orleans, and I lack the confidence in our elected officals to undertake such a momumental task.  I guess the politicians have followed suit as other members in leadership positions and have constructed their &#8220;Katrina get-a-way homes.&#8221; while the rest of us sink or swim.  With a heavy rain fall, our streets flood, and our canals overflow. Maybe we should move to the Netherlands while the politician work everything out.</p>\n<p>Thanks for sharing the article.</p>\n<p>Sincerely,</p>\n<p>Barbara</p>\n"
