  date: "2010-06-09T19:07:54"
  content: "<p>I live in Gentilly, a part of New Orleans that was badly flooded and hasn&#8217;t yet recovered. I don&#8217;t feel safe this hurricane season.  Why?  The canal floodwalls that broke still haven&#8217;t been repaired.  And one large opening to the lake doesn&#8217;t yet have flood gates &#8211; The Industrial Canal.  If a powerful surge pushes into it, Gentilly, New Orleans East, and possibly the 9th Ward will again be flooded.  Thanks, Corps</p>\n"
