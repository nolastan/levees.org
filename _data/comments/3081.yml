  content: "<p>1. give the corps a realistic budget so they can fix the levees!<br />\n2. make the government responsible for insufficient designs and the damage those designs do, after all, private companies would be held responsible if something they designed failed and cause the loss of human life<br />\n3. give us a fair share of our wealth and we can build our own system. The guy who fishes and hunts in our wetlands knows how that water moves under any given circumstance better than anyone else. Use that knowledge.<br />\n4. My father left the our house in our boat from our driveway after Betsy and took people off of their roofs across the river in Chalmette. Had anyone in a position of power listened to the people who knew the waterways, the Mississippi River Gulf Outlet (MRGO) wouldn&#8217;t have been built. THEY KNEW IT WOULD ALLOW A STORM SURGE INTO NEW ORLEANS AND WOULD FLOOD CHALMETTE, THE 7TH AND THE 9TH WARDS. </p>\n<p>NO ONE LISTENED, THEY WERE JUST IGNORANT FISHERMEN WHAT THE HECK DID THEY KNOW. It flooded for Betsy (a direct hit, the eye went over our house in Algiers, LA) and then again for Katrina, a storm that hit 65 miles to the east of New Orleans.</p>\n<p>Intelligence comes in all kinds of packages, it seems to me, we as the human race should start using it to our advantage for all of us.</p>\n<p>Louisiana provides 35% of the oil and gas sold in this country. We are a national asset and a national necessity.</p>\n<p>If it can happen to us, it can happen to you. Think about it and support the investigation into the aftermath of Katrina.</p>\n"
