  date: "2010-07-08T08:54:51"
  content: "<p>On a 7-day trip through the Gulf Coast, from Natchitoches to Pensacola and a side trip to Grand Isle, it BP workers refused to speak with me, and I was holding Louisiana Press credentials at the time.  I found support managers from independent contracting companies also unable to contact official headquarters, with phones unanswered.  I was unable to speak with anyone at those same telephone numbers, where phones rang unanswered.  On Grand Isle boats cost $400, and for reporters that is prohibitive.  Any press tours are at press expense and expensive.  Barriers to accessing first-hand material are everywhere, even in mid June before the new regulations about how far anyone can be with respect to wildlife and oiled areas.  My biggest worry is the fear and misinformation of the public when press access is restricted, even when the press holds official credentials.  We all remember what misinformation did to Katrina victims, and it is critical for the press to have access up close to what is happening, if nothing more than to alleviate the anxiety of thousands of people.</p>\n"
