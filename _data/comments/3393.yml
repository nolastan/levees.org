  date: "2010-08-11T09:15:06"
  content: "<p>I have received dozens of appreciative comments responding to my printing of Steve Gorelick&#8217;s observations (with his approval) about the people of New Orleans.  I have re-printed just a few of the comments here:<br />\n<em><br />\n&#8220;Thank you for sharing- I have shared this with numerous others!&#8221;</p>\n<p>&#8220;I am sobbing, what a beautiful tribute.  Can I send it around?&#8221;</p>\n<p>&#8220;Wow &#8211; glad to see that we are still inspiring that kind of reaction.&#8221;</p>\n<p>&#8220;That was a beautiful letter.  Thanks for sharing it.&#8221;</p>\n<p>&#8220;Really wonderful impressions and heart. Beautiful read.&#8221;</p>\n<p>&#8220;Thanks, Sandy, for sharing his wonderful letter. Steve Gorelick gets us!&#8221;</p>\n<p>&#8220;I had chills reading it because he GOT IT! He was able to perceive and appreciate the uniqueness of the people of New Orleans. Those of us that were born and raised here are &#8220;married&#8221; to the city.  I hope he and his family will visit us again soon.&#8221;</p>\n<p>&#8220;Dr. Steve Gorelik&#8217;s letter blew me away.  He really GETS it about our passion for our city the way very few &#8220;outsiders&#8221; do.</em></p>\n"
