  date: "2010-08-11T13:20:49"
  content: "<p>I am so moved and grateful for the response. It poured from a full heart and all I can think &#8212; and all my daughter Molly and wife Amy can think &#8212; is when we get back.</p>\n<p>I guess that, at this point in my life, I needed to see some good old fashioned, passionate stubborness,</p>\n<p>In admiration,</p>\n<p>Steve Gorelick</p>\n"
