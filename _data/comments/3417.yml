  date: "2010-08-23T14:49:49"
  content: "<p>I can appreciate the Historical Marker that was placed at the 17th Canal Breach but I don&#8217;t understand why the Industrial Canal, Lower 9th Ward, breach was not the 1st marker. This breached not only once but twice with Rita. The lower 9th ward &amp; parts of St Bernard were hit a double blow. I think the 1st location choice was a poor one!</p>\n"
