  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2010-08-25T17:46:51"
  content: "<p>Dear Marianna,</p>\n<p>The Historic Plaque grew out of a Lakeview citizen&#8217;s effort to educate tourists and passers-by about the flooding.  An informal sign on the private personal property of Roy Arrigo (a few houses south) grew and blossomed into the idea of installing a Louisiana State approved plaque.  Like many things in life, it was a process that started with just a kernel of an idea.</p>\n<p>With Mr. Arrigo&#8217;s assistance it took nearly a year to learn to navigate the process of getting approval for the Historic Plaque, getting it manufactured and finally installed.   Now, with experience to draw on, future plaques could become reality in far less time.</p>\n<p>It&#8217;s Levees.org&#8217;s intention to hold fundraisers to raise the funds for future plaques at other breach sites.  And if any neighborhoods wish to sponsor plaques on their own, Levees.org is prepared to reach out and guide them and advise them in this important effort.</p>\n<p>Sandy Rosenthal, wife, mom, Who-dat and founder of Levees.org</p>\n"
