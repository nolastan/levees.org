  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2010-08-28T08:40:10"
  content: "<p>Dear Susan,</p>\n<p>Here is the inscription of the Plaque.</p>\n<p>17th STREET CANAL FLOODWALL</p>\n<p>On August 29, 2005, a federal floodwall<br />\natop a levee on the 17th Street Canal, the<br />\nlargest and most important drainage<br />\nCanal for the city, gave way here Causing<br />\nflooding that killed hundreds. This breach<br />\nwas one of 50 ruptures in the Federal Flood<br />\nProtection System that occurred that day.<br />\nIn 2008, the US District Court Eastern<br />\nDistrict of Louisiana placed responsibility<br />\nfor this floodwall’s collapse squarely on<br />\nthe US Army Corps of Engineers; however,<br />\nthe agency is protected from financial<br />\nliability in the Flood Control Act of 1928.</p>\n"
