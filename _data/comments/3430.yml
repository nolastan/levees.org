  content: "<p>could you please get these original lyrics to Sandy Rosenthal:<br />\nI would love for her to hear the tune, I just do not know how to contact her:</p>\n<p>Road Back Home<br />\nLeft soaking wet, now dry as a bone<br />\nOn the road back home.<br />\nAll shut in with the next of my kin<br />\nOn the road back home<br />\nAint no telling what we gonna find<br />\nWhats left of whats left behind<br />\nOn the road back home to Louisiana<br />\nBack down to New Orleans<br />\nLost my way with the LRA<br />\nTo the back of the line<br />\n“All clear” say the corp of engineers<br />\nBetter get it right this time<br />\nGotta get back, and I cant wait<br />\nfor the very next thing the mayor may or not say<br />\nOn the road back home to Louisiana<br />\nBack down to New Orleans<br />\n(chorus)<br />\nDragging up , dragging up<br />\nWhere in the world did you drag up<br />\nWhen they siphoned the city<br />\nWhere did you hang to dry<br />\nDragging up,dragging up<br />\nYou got that long lost look in your eye<br />\nWhen they siphoned the city<br />\nWhere did you hang to dry<br />\nWrapped this state in a roll of red tape<br />\nCan’t take much more<br />\nAllstate man aint got no hands<br />\nIts written all over the wall and the door<br />\nSo you can stop the presses and cut the crap<br />\nHell or high water, we coming back<br />\nDown the road to Louisiana<br />\nBack down to new Orleans<br />\n(chorus)</p>\n<p>Andy Cale<br />\n504-909-3684</p>\n"
