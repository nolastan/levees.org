  content: "<p>Oh, I&#8217;m sooo glad for the plaque.<br />\nIts significance is important to me:  memoralizing the event, for those lost, things lost, grieving, and for the rebuilding of community, lives, and discovery of self.  </p>\n<p>Thank YOU so much, Ms. Rosenthal, for all the incredible work that you do! </p>\n<p>Margaret &#8220;Linda&#8221; Le Bon<br />\n125 Stafford Place   NOLA 70124</p>\n"
