  content: "<p>I&#8217;m so happy that there is something letting people know what really happened. I&#8217;d still like to know what happened to the $854 million donated by other countries. I know that the United Methodist Church got $66 million of it and paid out $13 million in salaries to their employees in 2006. But I think that with close to a billion dollars, 5 years and little hurricane activity, there should have been more improvement.</p>\n"
