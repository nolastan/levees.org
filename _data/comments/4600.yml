  content: "<p>Hi Sandy, I&#8217;m in London but used to live in the US and of all the places I&#8217;ve enjoyed, found New Orleans the most enchanting. The devastation of Katrina was bad enough without the added tragedy of BP on your doorstep and the politicians both here and there will happily sweep it all under the carpet IF YOU LET THEM. They wear any unwelcome opposition out by sending it through&#8217;channels&#8217; so they can stonewall. I just hope you have enough determination and support to shout louder because their self-interest is usually stronger than the will of people suffering adversity. Your city is a gem and shouldn&#8217;t be sidelined thus. It has a cosmopolitan feel unlike anywhwere else in the States, an independent character all it&#8217;s own; maybe that&#8217;s what they don&#8217;t like. Keep going.  Nickie</p>\n"
