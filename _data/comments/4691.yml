  date: "2011-05-03T23:48:56"
  content: "<p>I&#8217;m glad to see they are starting to get things right! And true enough the new Corps is nothing remotely like the Corps of our fathers.</p>\n<p>But, there is something going on I don&#8217;t yet grasp. A story to be uncovered. Something fishy is is in the works&#8230;</p>\n<p>Currently I am looking out across a US Corps of Engineers flood control reservoir at a Corp&#8217;s flood control dam in central Ohio. It&#8217;s been raining heavily for weeks. Usually in a situation like this (as it did a few months ago) this dam and those around are closed and the lakes rise. Creeks overflow and fields flood&#8230;as the system is designed to alleviate major flooding downriver.</p>\n<p>Oddly enough NONE of the local dams are shut, and in fact this reservoir has dropped a number of feet over the last two weeks! That means there is actually more water heading downstream than the rain is delivering!</p>\n<p>So why is the Corps of Engineers blowing up a levee at the corner of the Ohio &amp; Mississippi rivers while not utilizing the flood control system upstream?</p>\n<p>I plan to inquire at the local USACOE office tomorrow and will forward any reply.</p>\n<p>Good luck, you&#8217;re doing a great job!</p>\n"
