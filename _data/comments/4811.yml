  content: "<p>Mr. Bosworth,</p>\n<p>I watched you on Fox 8 news in New Orleans, La. on Wednesday, May 18, 2011, talking about the levees and all the great walls in the New Orleans and surrouding areas.  I wanted to let you know that I reside in an area that was left out of the 100 year storm protection. I live in Braithwaite , Louisiana, which is on the east bank of Plaquemines Parish.  There is an 18 mile section of levees from the St. Bernard Parish/Plaquemines Parish line that was left out of the 100 year storm protection, but never gets talked about and there is no one trying to help us get the storm protection. You want to talk about all the money the government has spent, what would it have cost for another 18 miles while they were coming into our Parish to protect St. Bernard Parish.</p>\n"
