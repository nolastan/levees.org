  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-05-29T11:40:27"
  content: "<p>Dear John,</p>\n<p>Thank you for inquiring about the London Avenue Canal breach sites.  There were over 50 breaches of the levee system on August 29, 2005 for a variety of different reasons.  The nomination of the 17th Street Canal and the Industrial Canal east side north are the first two nominations, not the last two.  If you have seen our 28-page nomination, you can see that the amount of work required is extensive.  It was for this reason that Levees.org, under deadline, was compelled, at least in the beginning stages, to nominate two breach sites which, we believed if taken together may exemplify the scope of the disaster.</p>\n<p>We have formally put in writing to the Louisiana Office of Historic Preservation that we intend to amend the nomination to include many more breach sites, including but not limited to the London Avenue Canal (east and west), the Industrial Canal west, the Industrial Canal east side south, and the MRGO.</p>\n<p>Sandy Rosenthal<br />\nWife, mom, whodat and founder of Levees.org<br />\n<a href=\"/\" rel=\"nofollow ugc\">http://www.levees.org</a></p>\n"
