  date: "2011-06-11T12:35:11"
  content: "<p><strong>This comment is posted by Levees.org with permission from Hannah Polmer.</strong></p>\n<p><span style=\"font-style: italic;\"> &#8220;After Hurricane Katrina struck there were reports on the news about the  memorials that would pop up along the Golf Coast commemorating the event. I imagined I would visit beautiful commemorative plaques and sculptures from New Orleans to Alabama. I am hoping my vision becomes reality because even as I speak about it six years later, people show an interest in knowing what happened to the civilization of that area and why. </p>\n<p><span style=\"font-style: italic;\"> &#8220;Last year I put up a plaque on the site where my mother&#8217;s house once stood.  She passed away there during the flooding of New Orleans. It was the only way for me to voice my anger and disgust over the levee failure of the 17th Street Canal and the deaths that occurred. </p>\n<p><span style=\"font-style: italic;\"> &#8220;In memory of Rachel Polmer, who loved New Orleans and her adopted country, and who lost her life August 30, 2005.  This monument honors all the residents of Lakeview who lost their lives, their cherished loved ones, and their beloved pets in the aftermath of Hurricane Katrina.  Let us show our eternal love of New Orleans in the way we remember these victims in our hearts.</p>\n<p><span style=\"font-style: italic;\"> &#8220;Thank you levees.org. for not allowing what happened to be forgotten.&#8221;</p>\n<p><span style=\"font-style: italic;\"> Hannah Polmer</span></span></span></span></span></p>\n"
