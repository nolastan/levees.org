  avatar: "770197bb2cde3b1929130bce69029df929e2121d933ce0d45f87d549900ce2ff"
  date: "2011-06-10T14:39:09"
  content: "<p>Footnote: Evacuations and checking on the elderly: Mom was already in her bed, dying, on the afternoon of Saturday, August 28, 2005. There was no way that I could move her from the bed to our car so that we could evacuate.</p>\n<p>The pastor of my church, who had already evacuated, called from Houston to urge me and Mom to evacuate; he never asked if we needed any help in getting out of our house and onto the road. Cousins of mine, who lived (and still live) within a 15 minute drive from where Mom and I lived (and where I still live), never once phoned to find out if we needed help in evacuating. They were already up in Shreveport!</p>\n<p>That is why I am so angry with people who were able to evacuate, but who gave no second thought to check on relatives, particularly elderly ones, to find out if there was a need for help for additional evacuation. Of course, we did not expect the levees to fail. Still, it would have been a nice consideration if someone from the family in particular had phoned, one way or the other.</p>\n<p>What happened six years ago is over and done with. But even today, I have second thoughts about whether to trust certain relatives or not when it comes to emergencies.</p>\n"
- id: 9215
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-06-10T15:05:32"
  content: "<p>Dear Judith, thank you for sharing this important message.  </p>\n<p>It&#8217;s true, no one expected the levees to fail.  As noted in the book The Making of a Catastrophe by W. Freudenburg, &#8220;no one asked them to evacuate on the grounds that the levees and floodwalls were about to fail, and those who concluded that they could withstand the storm were essentially correct in their thinking.&#8221; </p>\n<p>However, that does not excuse family, friends and neighbors who should have inquired if assistance was needed before, not after they left town.</p>\n<p>Sandy Rosenthal, wife, mom, whodat and founder of Levees.org</p>\n"
