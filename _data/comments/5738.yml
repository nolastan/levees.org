  content: "<p>This comment from Jimmy Roy is published with the commenter&#8217;s permission.</p>\n<p>WOW!!!  Thank y&#8217;all for such an EYE-OPENING map!!!  I&#8217;m a New A&#8217;wlins boy who has not traveled too much, so I am blown away at the number and concentrations of all these levees.  &#8216;Course I figured that the whole length of the Mississippi system would have them&#8230;but for the rest&#8230;wow!!!<br />\nThe push pins indicating poor/bad levees is a sad state of affairs&#8230;<br />\nTook a while to load, but well worth the wait.  Now I can&#8217;t wait to start forwarding this info.<br />\nDamn right we&#8217;re winning!!!</p>\n"
