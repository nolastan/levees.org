- id: 18786
  parent: 0
  author: "John Koeferl"
  author_url: ""
  avatar: "c925a43edf6cd5acd3e3481f71252cf5a19fd371527e053847ed22d468772e39"
  date: "2011-09-10T10:09:55"
  content: "<p>This court order is welcome news not just for the Lower Ninth Ward and environmental organizations but is much broader.</p>\n<p>The Court has stopped the unregulated Corps. It has said &#8220;halt&#8221; to de facto Corps entitlement to build whatever it wants with little effective concern for the environment.  In this case, the Corps had decided after Katrina to go ahead with plans for the MRGO New Lock even after this deep ship channel had eroded miles of protective wetlands and flooded the City. </p>\n<p>The Corps opened the Katrina door but even with all the levee work did not shut it.  Instead of doing scientific reassessment of the need for a new lock, requested by neighborhoods and by the Court, the Corps decided to take the low road. It re-named the old project and continued to coast on its presumption of competence and its own arbitrary authority to pull it off.</p>\n<p>Surprise! </p>\n<p>For once, thanks to the Court, business as usual didn&#8217;t work.  Now the people of the Lower Ninth Ward have better prospects for recovery, even with lower levees than rest of the city. It is good for us all that the Corps has been stopped here by the Court.</p>\n<p>Thanks to levees.org and all of you for your support to make the Corps accountable. Our work is not done but we can celebrate this moment together.</p>\n"
