  date: "2009-06-18T11:25:48"
  content: "<p>Dear Sir,</p>\n<p>Please don&#8217;t let the illegal actions of a few &#8220;Bad Apples&#8221; in the Army Corps of Engineers wreck the good work the corps dose and your reputation as a independent news source.</p>\n<p>Please provide the levees.org and your readers all relevant information about the sources of comments that came from Government I.P. addresses to articles regarding the A.C.E., levee work and levees.org critiques. The American people have the right to know and your organization has the responsibility to tell them when your independent news company  services are being used by the government to covertly influence public opinion. </p>\n<p>Otherwise, these few &#8220;Bad Apples&#8221; will reduce your organization to the level of propaganda machine the credibility you and the A.C.E. once enjoyed, will be gone forever.</p>\n"
