- id: 20637
  parent: 0
  author: "Derek"
  author_url: ""
  avatar: "d6c674eae02dba5a6ef9f006e55197bd0c7ed765ac65f847ffec0c66059e4f63"
  date: "2011-09-27T20:44:13"
  content: "<p>I&#8217;m not sure I quite understand. You clearly blame the Corps of Engineers for the levees breaking, yet at the same time post articles about court orders blocking them from actually doing anything. They had a plan to reinforce the levees years before Katrina, but the Sierra Club filed a lawsuit against them (concerned more about the effect it would have on local birdies), effectively stopping the reinforcement. Then the levees break and you still somehow want to blame the Corps? I think John there is right, and you&#8217;ve got some sort of vendetta against the Corps.</p>\n"
- id: 20638
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-09-27T20:49:52"
  content: "<p>Ad hominem.  That is what people do when they run out of talking points.  They go after the person.</p>\n"
- id: 20699
  parent: 0
  author: "Bob Molina"
  author_url: ""
  avatar: "6fe783b5bcf522851f212536aff2f2190f1624ffbb0670447fb43faf870dea7a"
  date: "2011-09-28T06:16:23"
  content: "<p>I don&#8217;t understand the need for this petition. What is the benefit from changing how this tragedy is referred to?  Will it change what happened, or what needs to be done?  Is this this terminology change the most important reason for trying to mobilize public opinion regarding the disaster?  </p>\n<p>Perhaps you could do a better job of explaining all this.  Then maybe we&#8217;ll feel there&#8217;s a real reason for all this effort.</p>\n<p>(I&#8217;m not arguing with you.  I just don&#8217;t understand why this focus on semantics.  Will this effort change what the government is or isn&#8217;t doing?  Will this petition truly benefit the good people of New Orleans?  Please do a better job explaining the need for this petition.)</p>\n"
- id: 20708
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-09-28T07:58:48"
  content: "<p>This is much more than semantics.  Blaming a natural phenomenon for the killing of 1,600 people and the drowning of a great American city minimizes the human element involved.  Saying Katrina destroyed New Orleans is just plain wrong.</p>\n"
- id: 20711
  parent: 0
  author: "Bob Molina"
  author_url: ""
  avatar: "6fe783b5bcf522851f212536aff2f2190f1624ffbb0670447fb43faf870dea7a"
  date: "2011-09-28T08:50:30"
  content: "<p>But we&#8217;re arguing over words, when action seems infinitely more important.  </p>\n<p>At this point, why argue over whether it was a &#8220;natural disaster&#8221; or not?  The problem is that levees failed, FEMA failed, and lives were lost or permanently scarred.  THAT&#8217;S the human element!  Shouldn&#8217;t we be focusing every ounce of our energy on fixing the problems, instead of arguing over what to call this horrid episode?  </p>\n<p>When we get hung up on blame, instead of addressing the real problems, aren&#8217;t we just spinning our wheels?</p>\n"
- id: 20712
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-09-28T08:54:13"
  content: "<p>Organizations and the people they employ with something to hide have a whole host of responses all prepared and ready to go.  They include:</p>\n<p>Shouldn&#8217;t we just move on?<br />\nShouldn&#8217;t we focus on making sure this never happens again?<br />\nDoesn&#8217;t this simply open old wounds?</p>\n<p>And finally, what is the point of investigating?</p>\n"
- id: 20715
  parent: 0
  author: "Bob Molina"
  author_url: ""
  avatar: "6fe783b5bcf522851f212536aff2f2190f1624ffbb0670447fb43faf870dea7a"
  date: "2011-09-28T09:39:20"
  content: "<p>Yes, we know how bureaucracies (especially government) operate.  Nothing new there.</p>\n<p>But what does that have to do with the question of whether the White House uses the term &#8220;natural disaster&#8221;??</p>\n<p>Is there a problem getting the Army Corps (or Congress) to address the levee issue?</p>\n<p>Has FEMA dropped the ball (yet again)?</p>\n<p>If the answer to either question is no, then what&#8217;s the purpose of this petition about the term &#8220;natrual disaster&#8221;?</p>\n<p>And if the answer to either question is yes, then what&#8217;s the purpose of this petition about the term &#8220;natural disaster&#8221;?</p>\n"
- id: 20717
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-09-28T09:52:04"
  content: "<p>Bob, the petition is about the event that occurred in August of 2005, an event so horrific that the whole world watched it on TV.  In Mississippi, the flooding was a natural disaster.  In New Orleans, it was not.  The flooding was the worst civil engineering disaster in US history.  It was also the worst in the world rivaled only by the Chernobyl meltdown.  </p>\n<p>Since his inauguration, the President has consistently called the flooding of New Orleans a natural disaster which is not only wrong, it confuses Americans.  It causes them to mistakenly believe the flooding of New Orleans was an unavoidable act of nature.  This is dangerous, because the majority of the American people lives in counties protected by levees.</p>\n"
- id: 20824
  parent: 0
  author: "Bob Molina"
  author_url: ""
  avatar: "6fe783b5bcf522851f212536aff2f2190f1624ffbb0670447fb43faf870dea7a"
  date: "2011-09-29T04:37:48"
  content: "<p>S, I&#8217;m well aware of the &#8220;event&#8221; of August 2005.  I was part of a group that came down to work with Habitat for Humanity post-Katrina; I&#8217;ve seen first-hand the horrific toll as well as the amazing resilience and spirit of the good people of New Orleans and beyond.  </p>\n<p>But my point remains: I still don&#8217;t understand why all this energy and effort into the semantics used to describe what happened.  I&#8217;d much rather see us focus on addressing the engineering issues themselves and, equally important, of ensuring that neither FEMA nor any other agency &#8220;forget&#8221; the countless people whose lives were upended, many of whom are still struggling.</p>\n"
- id: 20844
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-09-29T08:51:47"
  content: "<p>So long as many Americans believe a hurricane flooded New Orleans, their leaders will not take the steps to prevent a reoccurrence.  Yes, evacuation plans were improved.  Yes, disaster response plans are improved.  But how do those prevent a reoccurrence of the levee failures in New Orleans or elsewhere?  The only way leaders will take the steps to make certain levees and floodwalls are safe is to recognize that it was a civil engineering failure, not a natural disaster, that caused 800,000-plus citizens forced to live outside of their homes &#8211; the greatest diaspora since the Dust Bowl of the 30&#8217;s.</p>\n"
- id: 20847
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2011-09-29T09:23:00"
  content: "<p>Here is an example of how our leaders forgot the engineering failures.  After the levees broke, Congress wrote true reform legislation.  But four revisions later and less than half the length of the original, the final bill passed in WRDA 2007 had no Research Program or Safety Training Program.  But most importantly, it had no independent Review Board at all, only a Levee Safety Committee, accountable to the Corps of Engineers.</p>\n<p>In the end, Congress handed more responsibility and power &#8211; with no independent oversight over our nations&#8217; levees &#8211; to the Army Corps of Engineers, the entity primarily responsible for the drowning of New Orleans.</p>\n"
- id: 21713
  parent: 0
  author: "Bob Molina"
  author_url: ""
  avatar: "6fe783b5bcf522851f212536aff2f2190f1624ffbb0670447fb43faf870dea7a"
  date: "2011-10-04T09:00:11"
  content: "<p>Finally, some clarity.</p>\n<p>Although I&#8217;m skeptical that Congress will do the right thing in its current toxic atmosphere, at least you&#8217;ve finally explained the logic behind this petition.  Here.  But perhaps you should do a better job of explaining why the petition itself is necessary where it counts: right in the beginning of this web page, where you ask people to sign.  </p>\n<p>I&#8217;m sure there are others like me who read the current plea for people to sign and had no idea what you&#8217;re really pushing for.  But once more people understand, they may do the same.  </p>\n<p>I suggest you rewrite the page to make it much clearer what the White House&#8217;s seemingly innocuous choice of words actually represents.  A more compelling argument will undoubtedly sway a lot more people to sign.</p>\n<p>I just did.</p>\n"
