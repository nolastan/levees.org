  content: "<p>I am an avid supporter of Levees.org but this time I must take issue with this request. The President can only do what Congress and the Senate allows him to do. This petition should be aimed at our Conservative and Tea Party Congressmen who could care less about our levees or anything but their own agendas. Heck, they don&#8217;t even want to fund FEMA. Sure, FEMA&#8217;s not perfect but it&#8217;s all we have for now. That is where all these petitions should be going.</p>\n"
