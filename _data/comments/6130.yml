  date: "2011-09-30T12:51:02"
  content: "<p>You know this information makes the case for more chapters of Levees.org in more states.</p>\n<p>As Ezra and I work to develop the interactive features, hopefully these other chapters will be able to input their own local levee data and information onto the Levees Interactive Map.<br />\nIn line with your own focus, per the Atlantic interview, we hope to make this Map: Open Access, though it will be more tightly administrated (by me) than Wikimedia or Wikipedia. (for example: Editilla eats Corps Astroturfers for breakfast so don&#8217;t even try it 😉<br />\nI hung it on the masthead of my blog <a href=\"http://noladder.blogspot.com/\" rel=\"nofollow ugc\">http://noladder.blogspot.com/</a></p>\n<p>Thanks again for making this Map possible in the 1st place, Sandy, and I hope others take Ezra and my example to BUMP IT UP A NOTCH, or jump in however, like start their own levees.org in their own state to hang with us.<br />\nTo mangle Ben Franklin: &#8220;We either hang together or we will surely all drown separately!&#8221;</p>\n<p>The Levees Interactive Map will help us chart our way together to all the places we are winning.</p>\n"
