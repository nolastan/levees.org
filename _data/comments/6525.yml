- id: 45019
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2012-02-10T14:48:10"
  content: "<p>Dear Richard,</p>\n<p>There were over 50 breaches of the hurricane protection levees in New Orleans and St. Bernard Parish on August 29, 2005. Levees breached and failed for a variety of different reasons. When Levees.org began the nomination process by selecting the 17th Street Canal and the east side north breach of the Industrial Canal, it was always intended that these be first two, not the last two. The nomination process is complex and the amount of work is both extensive and expensive. Faced with a deadline in July 2010, Levees.org was compelled, at least initially, to nominate two breach sites which, we felt if taken together might illustrate the broad scope of the disaster.</p>\n<p>An additional four levee breach sections (that retain integrity) that occurred on August 29, 2005 may be nominated to the National Register at a later date following future research on those breach sites.</p>\n<p>We also wish to bring to your attention that Levees.org did the work and absorbed the expense to install a Louisiana State Historic Plaque at the east side London Avenue Canal breach site.  The plaque is located at the intersection of Warrington and Mirabeau and was installed on May 20, 2011 with Irvin Mayfield Jr present who played on the Elysian Trumpet.</p>\n"
