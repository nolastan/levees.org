  content: "<p>One has to be seriously blind to think that NOLA.COM was anything legit for New Orleans. NOLA.COM is the most corrupt propaganda machine that I have ever seen in the state of Louisiana. La. state already has a biased and horrible media but NOLA.COM just took the King Cake and the baby! The articles were planted, the writers are hired based on their ignorance (real or selective) of what is really news worthy in the area of New Orleans, the user names that didn&#8217;t promote a hateful, corporate and corrupt agenda were deleted or banned and the site offered nothing of facts since it was created. It is state owned and not a free press. NOLA.COM was the main reason that so many citizen reporters and blogger sprang up in New Orleans after Katrina.<br />\nEven as of today, if a citizen post about any form of corruption, happening in a Parish involving these &#8220;good ole boys&#8221; NOLA.COM blocks the user for life but yet one can go onto NOLA.COM and hold a Ku Klux Klan rally with relative ease!</p>\n"
