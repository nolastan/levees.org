- id: 53449
  parent: 0
  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2012-04-03T09:53:00"
  content: "<p>Mr. Walker, the Army Corps of Engineers will appeal the ruling.  There is nothing the citizens can do but wait while the appeal goes all the way to the Supreme Court.  We can expect to know the outcome in late 2013.  Dr. Ivor van Heerden expects the ruling to be upheld and for the plaintiffs to be victorious.  However, Dr. van Heerden also notes that the ruling would be unfair because everyone in regional New Orleans was affected by the levee failures, not just those in St. Bernard Parish and the Lower Ninth Ward.  Dr. van Heerden predicts a &#8220;Katrina Bill&#8221; which would compensate everyone even those denied relief because the Corps was protected by sovereign immunity in the Flood Control Act of 1928.</p>\n<p>Sandy Rosenthal, founder of Levees.org</p>\n"
