  author: "Hilda Hartmann"
  author_url: ""
  avatar: "d86280c8a7433fa2ed8631c2d9cd88e25695b6b75f0949c357ebb34cf337e708"
  date: "2012-06-27T11:28:36"
  content: "<p>When and if there is a settlement from the lawsuit, will what you received from your insurance company be deducted?  If so, this is not fair to the people that had flood insurance for the correct amount and could not get any assistance at all.  The mortgage companies used the part of the mortgage that stated &#8220;if the property is 100 percent damaged that you must pay off the mortgage.&#8221;. This put everyone in this predicament at a loss.  I lived in St. Bernard Parish and was only 12 years from retirement, however since I had to start over on my own I will now not be able to retire until I am 80 years old.</p>\n"
- id: 68254
  parent: 0
  author: "Jody"
  author_url: ""
  avatar: "2ebd1b0f417adda4a2eed26df4caefc3e54f7d11f49bd8db73ec0ee9321ea80f"
  date: "2012-08-23T13:24:51"
  content: "<p>My brother and I lost our father when the flooding devastated St. Bernard Parish. He lived in Arabi and drowned in the flooding.  Then, the Baton Rouge morgue lost his body after my brother finally was able to locate him in the house.  Both he and I had to give multiple DNA samples before the morgue officials found his body.  What about that emotional and physical injustice?  The Army Corp of Engineers need to be held accountable for the failure of the canal. Our father was assured he could purchase a house in the area and be safe.  7 years have gone by and we&#8217;re still dealing with the painful aftermath.</p>\n"
