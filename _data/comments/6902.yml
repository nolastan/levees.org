  author: "S. Rosenthal"
  author_url: "http://levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2012-05-25T18:09:20"
  content: "<p>There were over 50 breaches of the hurricane protection levees in New Orleans and St. Bernard Parish on August 29, 2005. Levees breached and failed for a variety of different reasons. When Levees.org began the nomination process by selecting the 17th Street Canal and the east side north breach of the Industrial Canal, it was always intended that these be first two, not the last two. The nomination process is complex and the amount of work is both extensive and expensive. Faced with a deadline in July 2010, Levees.org was compelled, at least initially, to nominate two breach sites which, we felt if taken together might illustrate the broad scope of the disaster.</p>\n<p>As we have stated on our website, we notified the Louisiana Office of Historic Preservation in writing in August 2010 that additional levee breach sections that occurred on August 29, 2005 may be nominated to the National Register at a later date following future research on those breach sites.  These include the east and west breaches of the London Avenue Canal.</p>\n"
