  date: "2024-06-19T00:45:35"
  content: "<p>It is now common knowledge among New Orleans residents that the levees were intentionally blown during hurricane Katrina to inundate the 9th ward and thereby protect other areas. Has further evidence emerged to support this broadly held belief?</p>\n"
- id: 589330
  parent: 589328
  author: "S. Rosenthal"
  author_url: "http://www.levees.org"
  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2024-06-19T08:05:57"
  content: "<p>Thank you for reaching out. While some residents of the Lower Ninth Ward insist that they heard the sound of dynamite during the early morning of August 29, 2005, there is no evidence that explosives were used. Investigative studies conclude that the northeast breach occurred because sheet pilings were too short, and the southeast breach occurred due to overtopping. For a full description, we suggest this link: <a href=\"/levee-exhibition-full-length-version/\" rel=\"ugc\">https://levees.org/levee-exhibition-full-length-version/</a></p>\n"
