  avatar: "c5d1ece0e376959e74d241dc3d2791465767ab09fe97178bc41acc5e2ed09bed"
  date: "2013-09-18T10:13:53"
  content: "<p>Jason,</p>\n<p>If you had hired an ethical professional engineer, which is a role the Corps performs, you would&#8217;ve expected your engineer to inform you of the risks of living on a volcano in terms you could understand and make actionable recommendations for courses of action you good take in order to appropriately respond.</p>\n<p>Telling you that you&#8217;ve never been safer is totally unethical for members of the American Society of Civil Engineers (ASCE).  This also holds true for civilian professional engineers who should be considering your safety rather than the growth agenda of politicians and developers who consider growth more important than safety.  PEs take a professional oath to &#8220;hold safety paramount&#8221;. Term limited politicians and developers have no such obligation</p>\n<p>The easy solution?  Start holding PEs accountable to their professional oath</p>\n"
