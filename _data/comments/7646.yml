  content: "<p>Land along the gulf coast is sinking due to continued pumping of the oil strata beneath the surface. Water pumped from Florida&#8217;s land caused sink holes with homes collapsing into them in a similar fashion. The products of combustion of oil or cellulose are carbon dioxide,water, and heat,i.e. more water results from oil use. When fires burn trees this also happens. When California has fires the middle of the nation gets rain carried by the jet stream and U.S wind patterns. This is simple science. We can&#8217;t just pump oil along coastal areas without continually raising levees higher. Science always trumps politics.    Hal Ashley, MD,PhD, Retired pathologist.</p>\n"
