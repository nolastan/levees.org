  content: "<p>I agree.  Ivor Van Heerden is a hero, a courageous truth-teller, and an esteemed academic.  LSU was in the wrong for firing him, trying to intimidate him, and for trying to cover up and hide the truth from the Louisiana public. Inexscusable behavior for any public university and they need to be held accountable for it so that it doesn&#8217;t happen again.  I hope this case is widely reported on.</p>\n"
