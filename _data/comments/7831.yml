  content: "<p>Yes, the bad actors of Katrina remain bad actors to this day.  The USACE still ignores the recommendations of the IPET to take a systems-based approach.  Following closely in their footsteps is BP who failed and continues to fail 32432gto hold safety paramount.</p>\n<p>We who are battling the entrenched forces of ethical hazards and disintegrity consider you an inspiration and beacon.</p>\n<p>And we thank you, KC King</p>\n"
