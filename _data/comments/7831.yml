  date: "2013-02-27T21:03:22"
  content: "<p>Dear Dr. van Heerden, </p>\n<p>So many of us think you are a hero. Thank you for your service to Louisiana. We hope the wounds of being so ill-treated heal and the many levels of trauma that came with Katrina will be mourned and gotten over and prove fertile ground for another world-class book that all of us will be waiting to consume. God Speed on your Travels and Best Wishes for your Sister.</p>\n"
