  content: "<p>My first time in a protest march was for Dr. van Heerden &#8211; in fact that is me in jeans and black shirt behind my friend, Heather, with third sign from the right (in above picture) I am so grateful to Sandy and the others at levees.org for holding the feet of the ACOE to the fire and for this wonderful website that we can count on for always telling us the TRUTH.  I was, and still am, outraged about LSU&#8217;s treatment of Dr. van Heerden.  Whistleblowers need to be better protected &#8211; all of them.  Thanks Dr. van Heerden &#8211; the citizens of NOLA will always be behind you!</p>\n"
