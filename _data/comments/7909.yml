  avatar: "60901e8d3dc3d19687523f1accaf178fbc3dbb9fc018b13813e2886a6d180212"
  user_class: "byuser comment-author-s-rosenthal bypostauthor"
  date: "2017-09-17T07:52:20"
  content: "<p>To our knowledge, all legal reimbursements have been distributed. In mid August, 125,000 checks were mailed to residents who had filed federal claim form 95. This money was proceeds from a $20 million settlement with 3 local levee districts &#8211; Orleans, East Jefferson, Lake Borgne Basin &#8212; and also the Southeast Louisiana Flood Protection Authority-East. You can see more about that here: </p>\n<p><a href=\"http://www.nola.com/opinions/index.ssf/2017/08/katrina_flood_settlement.html\" rel=\"nofollow ugc\">http://www.nola.com/opinions/index.ssf/2017/08/katrina_flood_settlement.html</a></p>\n"
