  content: "<p>Dear Director of the George W. Bush Museum and Library,</p>\n<p>Any historical display on Hurricane Katrina needs to include the fact that in New Orleans and St. Bernard Parish the flooding WAS NOT a &#8220;natural disaster&#8221; it was a engineering failure on a grand scale. The Corps of Engineers failed the citizens of New Orleans and St. Bernard Parish by not building the levees as strong as they claimed they where.</p>\n<p>One of the reasons for the engineering disaster was the reduction of the Corps of Engineers New Orleans District budget by the George W. Bush administration in 2004 and 2005.</p>\n"
