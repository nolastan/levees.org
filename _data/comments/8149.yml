  content: "<p>Sandy,</p>\n<p>At the time I too supported that reform.  Though &#8216;taking the politics out of it and replacing the board with experts&#8217; sounded all warm and fuzzy at the time, I came to realize that this replaced accountable officials (either elected or employed) with appointees who cannot be fired or voted out for poor performance.  This turned out to be a very serious mistake.  It has been said that &#8220;Power tends to corrupt, and absolute power corrupts absolutely&#8221; It couldn&#8217;t apply any more than here.  These appointees were accountable to no one.  This power in their hands has led to all sorts of misdeeds by this board&#8217;s leadership and there is nothing that anyone could do to stop them.  They have operated outside and above the law yet they can&#8217;t be fired and they cannot be voted out.  It is concerning that the New Orleans Sewerage &amp; Water Board is yet another local board that is going down this dangerous path of replacing accountable people with appointees who are accountable to no one.</p>\n"
