- id: 982
  parent: 0
  author: "Jerry Newburger"
  author_url: ""
  avatar: "cd0747aaf2870c939f40022c95824c1e1e544603d6e80d5e0501568343c7b764"
  date: "2009-07-29T11:22:37"
  content: "<p>I find Mr. Amoss’ letter perplexing.  An editor of a major newspaper must always engage in dialog and communication.</p>\n<p>One of the paramount responsibilities of a free press would seem to me to be an unwavering pursuit of the “Full Story”. We need more than the ‘What’, of New Orleans’ flooding; we need the ‘Why’.</p>\n<p>And in the past the Times-Picayune has pursued just such a course.  An editor must encourage his reporters to take chances, to investigate leads, and above all talk to everyone they possible can.  </p>\n<p>The LSU team, and Levees.org, are attempting to bring light into what is still a dark and murky cover-up of the ‘Why’.   The suppression of this is in itself a story worthy of investigation.</p>\n<p>The Times-Picayune has done exemplary and laudable work in the past,   uncovering corruption and the truth about Katrina.<br />\nBut now is the time to renew efforts toward uncovering the companies and people responsible for this engineering holocaust.  </p>\n<p> Mr. Amoss mentions “shoddy” engineering, yet this is only the tip of the iceberg. </p>\n<p>What of Eustis Engineering?  Or the firm of Modjeski &amp; Masters?  Have these firms been investigated?  Do they receive new Core contracts?  Have all the contractors been interviewed?  What of the Army Core’s chief engineer that approved the faulty design? What of the staff and command structure in the Army Core which remains hidden?  Who was responsible for the Army Core sign off of the Floodwall plans?  </p>\n<p>So many questions unanswered and so little attention by the mainstream media.  If the Times Picayune does not step up to the task, then who will?  </p>\n<p>Most of America still believes our City to have been destroyed by a natural disaster, rather than the negligence and misdeeds of the Army Core of Engineers.  The Press must be the ally of the People, not of the bureaucracy which feeds off them.</p>\n<p>It is the responsibility of an editor to pursue and encourage the reporting of Truth, and while this is a daunting task, each step in cooperation with others devastated in this disaster is a step in the right direction. </p>\n<p>It is not acceptable for the Times-Picayune editor to make excuses or simply remain silent. </p>\n<p>Jerry Newburger<br />\nFormer Lakeview &amp; Uptown Resident<br />\n4th generation New Orleanian</p>\n"
- id: 993
