- id: 1001
  parent: 0
  author: "StillWondering"
  author_url: ""
  avatar: "77a5955951f6896044bb37bdb07b646e8ea811974cf55bda55534a25f502692d"
  date: "2009-07-30T21:50:38"
  content: "<p>I am much confounded as to why the Times Pic hasn’t run with the ball re: demanding that heads should roll for the abusive postings.  Is deliberate misinformation from our government implicitly condoned?  Judging from the fact that there was a tiny bit of coverage, apparently not; but also apparently, it has been swept under the rug – as has any aggressive reporting regarding the failure of the ACOE (read, our federal government) to properly construct levees.</p>\n<p>After one of the most calamitous incidents in American history, we still have no answers.  The who’s, the why’s, the how’s.  The contracts, the engineering errors, the malfeasance.  All of these scream for a huge light to be shined upon them!</p>\n<p>People all around the country live in the shadow of ACOE construction.  They are probably as clueless as New Orleanians were previously.</p>\n<p>Now, however, New Orleanians’ eyes have been opened.</p>\n<p>How does one move home, and have any confidence that the same thing won’t happen again, without that bright light?  Will the levees that didn’t fail do so at some point in the future?  What guarantees are there that the new ones won’t do the same?  Might the new ones in some fashion put additional stress on the old structures?</p>\n<p>Still in the dark, with no light at all.  No neutral entities to check and double check.  No 8/29 investigation to date.</p>\n<p>Again, I am confounded as to why Mr. Amoss doesn’t sic his team on this.  It could be the biggest story he will ever have.</p>\n"
- id: 1002
  parent: 0
  author: "Dennis Kelley"
  author_url: ""
  avatar: "75af43f3110a68ec86b4204b4a35837b3fdafa511e4e378083fd3c9c74ead9be"
  date: "2009-07-30T23:02:42"
  content: "<p>I had subscribe to your paper for 40 years and then it dawned on me that all that was in the paper was what you wanted people to know, not the whole story. What ever happened to reporting the news? People deserve to know the whole story concerning any investigation started or needed. Set an example for this nation and New Orleans will prosper and grow because prople will want to live here or return, what ever the case might be.Lets do it right.</p>\n"
- id: 1003
  parent: 0
  author: "LG"
  author_url: ""
  avatar: "9fa97d1df8c2abaa86a217e0b43f4c4e59ae3157df0d27435b6f70d46c44a065"
  date: "2009-07-30T23:08:54"
  content: "<p>I am with Bari Landry on this one. As an editor and journalist, I can&#8217;t understand how Mr. Amoss can back away from a hot potato story that is perfectly on topic for his readers. One almost has to wonder if his reticence is political, and not a simple matter of waiting for more news to develop. If Mr. Amoss has, hypothetically, been coerced into limiting his paper&#8217;s investigation into the Army Corp of Engineers&#8217; actions, people will find out, because this type of corruption no longer goes unnoticed. It will be an embarrassing day for the Times-Picayune, if that&#8217;s the case. </p>\n<p>In response to Mr. Amoss&#8217;s line, &#8220;If this story develops further, we will cover it,&#8221; I say the following: The news has already happened, Mr. Amoss. There is no need to wait for future developments. Your job and that of your reporters is to dig as deeply as you can through the information that you already have or have access to. The information you need is out there. The question is, how hard are you willing to work to find it?</p>\n"
- id: 1010
  parent: 0
  author: "underdike"
  author_url: ""
  avatar: "3063da1bbe388b9668ad1915555997fcac9205c136e61f3d36f66f0a6ca6c1a8"
  date: "2009-07-31T23:05:36"
  content: "<p>Mr. Amoss,</p>\n<p>Policies are made to be broken, when appropriate.</p>\n<p>Please break your rule about announcing ongoing TP investigations and tell us you are looking into this Corps manipulation of the media thing and just what forum messages originate at the USACE New Orleans District with times, username and message. We can wait, but we need to know if you are looking into this matter. Telling us this would definitely appease those subscribers saying there should be a TP boycott because of this situation with the Corps.</p>\n<p>We all think we know the difference between right and wrong. The Corps destroyed our beloved city and is using the TP to persuade people the Corps was not responsible for the floods &#8211; that it was us, their victims. It&#8217;s just not fair. Show us you know wrong when you see it. You have the data and power to verify or disprove the Corps conspiracy. Please don&#8217;t give them the pass they feel they demand.</p>\n"
- id: 1213
  parent: 0
  author: "Patty Whalen"
  author_url: ""
  avatar: "a606ecf6c22e0188af332ff7749b5182e4f9ed0c11de2e7b6a5fc8c8f77e8a28"
  date: "2009-08-25T02:47:57"
  content: "<p>Dear Mr Amoss:<br />\nI am a subscriber to the newspaper because unfortunately in our local vernacular</p>\n<p>..&#8221;dats all we got Padna..&#8221; otha den News on Wheels and all &#8230;know what Ah mean?</p>\n<p>Your comment here ironically reveals precisely the problem with your coverage and your newspaper and not simply re the issues in the letter by Sandy Rosenthal to you re the items enumerated there.<br />\nYou state:<br />\nThe notion that either James or I or anyone in our news operations would deliberately withhold information lest it upset the Corps is both preposter&#8230;ous and deeply offensive. Therefore, please forgive me if I choose not to respond to or engage in dialog with the person who is spreading those allegations.</p>\n<p>You refuse to speak with the source of a story&#8230;a newspaper editor refuses..to do what you and others in your quickly dieing irrelevant industry demand and expect every day under the moral righteous of ..the people have a right to know &#8230;the people deserve the truth&#8230;</p>\n<p>You acknowldege precisely the problem Mr Amoss. You carefully remove yourself and your newspaper from the very principles under which you and others wish us to read stories every day and under which&#8230;you even publish &#8230;</p>\n<p>How can a newspaper editor refuse to speak with the source of a story that you say is alleged? Absurd.</p>\n<p>Your comments therefore are absurd&#8230;<br />\nWere it not for this &#8220;source&#8221; spreading..<br />\n&#8220;allegations &#8220;of a lot of other issues that this source pursued on her own and with the help of citizens&#8230; for the last 4 years..not the least of which is the founding and sustaining  of an organization that continues to pursist in uncovering and promoting the truth..you and your convenient approach to the news would not have had a basis or even a clue re most of the stories you thrust here before us to promote your paper.</p>\n<p>I know ole Harry Thomson would not at all like the letter one more Blue Jay wrote<br />\nin response to the search for truth.</p>\n<p>Shame on you.</p>\n"
