  avatar: "a0e1da136389d0a69e6e2492b1181b64c8750a723f692f06f76458fcff08bc1c"
  date: "2009-07-30T13:12:28"
  content: "<p>Of the four links Amoss cites, two are editorials and one is a letter to the editor.  The only one that is actually an article is titled &#8220;Corps lets workers argue with critics&#8221; &#8211; are you serious?  It&#8217;s like Amoss has completely missed the point!</p>\n"
- id: 994
  parent: 0
  author: "Ken Conner"
  author_url: ""
  avatar: "b9b96bf549b417b16888a2d7ff2b95e163744c22841d303593bf62df3631b582"
  date: "2009-07-30T15:11:50"
  content: "<p>An open Letter responding to Mr. Amoss:</p>\n<p>First off, thank you, Mr. Amoss, for continuing the paper’s coverage during and after the storm.  Like many new Orleanians, I found it invaluable.  And because of that dedicated coverage, I find it now puzzling that your paper would hesitate to investigate ANY following information on this story…</p>\n<p>But am I supposed to feel particularly sorry for you and your editor who lost his house?  THOUSANDS of your readers ALSO lost their homes.  And THOUSANDS more spent two years getting their homes back together.  And THOUSANDS more are STILL working to get their homes together.  And THOUSANDS were displaced and continue to labor under inopportune exile.  So why is your suffering any more severe?  </p>\n<p>And certainly, no one can justify NOT investigating the Corps because of personal suffering—that is precisely WHY stringent investigation SHOULD occur.</p>\n<p>Your letter appears to attempt to disassociate your newspaper from the nola.com blog.  Why do that?  Your paper started the website.  And when unpleasant information about the Corps is revealed, or indicated, you should stick to your guns and follow through.</p>\n<p>It is disturbing to lean the Corps used government financed equipment and a government financed URL address to send disparaging comments (read intimidation) to discredit citizen critics of the Corps.   Why not address the problem INSTEAD of trying to “shoot the messenger”…?</p>\n<p>Because of the disaster and because of the personal suffering and because it is what competent media does and because it is what American citizens expect; you have a responsibility to particularly investigate any, and all, information about potential Corps malfeasance.  Otherwise, the problems remain and countless other THOUSANDS of American citizens will suffer in the future.</p>\n<p>Ken  Conner<br />\nDisplaced New Orleanian</p>\n"
- id: 996
  parent: 0
  author: "Editilla~New Orleans Ladder"
  author_url: "http://noladder.blogspot.com/2009/07/mercredi_29.h"
  avatar: "cb17c73b9440a1f03f8cf74b61cf60f9e08c218905a4f3e075044f5e7a4a0349"
  date: "2009-07-30T16:56:46"
  content: "<p>I am assured by former employees that this Editor is much much smarter than this.<br />\nYeah, so Jim Amoss saw dead people too, eh?<br />\nDifferent ghosts for different boasts I suppose, but&#8230;<br />\nThe problem here is not one of insult, but of Corps&#8217; violation of Federal Code governing Computer Fraud on Federal Property.<br />\nIt would be way&#8217;mo&#8217;betta if Editor Amoss could suck it up and answer Questions of Culpability and Conspiracy After The Fact,<br />\n&#8211;rather than crying Mommy over Spilled Lake Water.<br />\nI&#8217;m sorry, but it just makes me Tremble when people try to pull that logic&#8217;rape equivalency bull&#8217;pockey.<br />\nI too survived that Flood in the City, and in fact laid eyes on the T-P headquarters building. That is precisely why they don&#8217;t get the benefit of the doubt when they take Corps Flood Funding for Advertisements and yet seem to miss things like the Big Leak at the 17th Street Canal (until we raised Hell) or how they have admittedly catered to the Article Placement Whims of the Corps $5 Million PR firm: OPP, or became goddamn flood wall filler for the Corps of Engineers!</p>\n<p>Editilla would like to thank Editor Amoss for deigning to respond to literally hundreds of letters asking WTF, but WTF difference does it make if he just wants to Blow More Smoke Up Our Ass?<br />\nIf this is James Amoss&#8217; idea of Editorial Leadership, then we can certainly understand why former Editor in Chief Jon Donely would prefer to go milk real goats!</p>\n<p>Thank you for staying on top of this important issue of actual free press.<br />\nGutenberg would be rolling in his grave.<br />\nBut more importantly, thanks for keeping the Story Told.</p>\n"
- id: 997
  parent: 0
  author: "Bari Landry"
  author_url: ""
  avatar: "c23197c8be1107619ee12d6338943c5d220ebcf99509372fd894ff999f175f87"
  date: "2009-07-30T17:02:43"
  content: "<p>Dear Mr. Amoss,</p>\n<p>For someone as deeply involved in the news business as you claim to be, it puzzles me that you would sit on a story of such tremendous importance not just to New Orleanians but to the entire nation.</p>\n<p>You have been presented with the &#8220;mother of all leads&#8221;.  The U. S. Army Corps of Engineers &#8211; an institution formed by and managed by our own Federal government &#8211; has used tax-payer funded equipment to wage a campaign to silence individuals who want to reveal the truth about what happened: that the levees failed due to their negligence.  This campaign, waged by government employees against their own citizenry, involved not only comments that &#8220;blamed the victim&#8221;, but resorted to name calling and race baiting.  While it did not involve weapons in the traditional sense, the U. S. Army Corps of Engineers waged warfare against the citizens of New Orleans using the new &#8220;weapons&#8221; of technology.  And the Times-Picayune, by virtue of their site &#8220;NOLA.com&#8221;, was made a pawn in this warfare.</p>\n<p>I want to know the truth!  If the USACE has engaged in this type of behaviour agaisnt the citizens of New Orleans, they must be made accountable!  And if this is the methodology which the USACE employs &#8211; failed engineering followed by a campaign to silence the victims of their mistakes &#8211; then the entire nation must be made aware.  For New Orleans is the current victim, but the rest of the nation can be considered &#8220;victims in waiting.&#8221;</p>\n"
- id: 999
  parent: 0
  author: "Jan Wells"
  author_url: ""
  avatar: "6b6a27958ba80042ea2110263675795b8530e6f82653b3fc803a64fe4e6a7273"
  date: "2009-07-30T20:33:17"
  content: "<p>The man who does nothing, does nothing wrong.<br />\nAccountability is missing. Very nice soft soap. Is it Palmolive? Good for your hands and apparently good enough to wash your hands of all responsibility to your public and keep your rather precarious standing with The Corp. What else can we think? You allowed the truth to go untold. Now you are whining about the storm. At least you lived. How many people DIED? Can we have the real truth on that little question? Weapons of mass technology=no accountability from the Times-Picayune &amp; The Army Corp. The Truth is M.I.A. Thanks for writing such a nice form letter.</p>\n"
