  content: "<p>Tha vacant tract of land across from the garden memorial was once the site of a &#8220;Garden Apartments,&#8221; complex, a type of apartment complexes popular in the 1950s and 60s. (Larger but simmilar were the Parkchester Apts.) My mother lived there briefly. It may have been called the Mirabeau Apartments. The land had been vacant long before Katrina and was used as camping space for Mexican workers after Katrina. The Mayor&#8217;s words in today&#8217;s Advocate shows we are still grateful to them.</p>\n"
