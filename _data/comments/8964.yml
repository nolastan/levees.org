  date: "2015-11-12T17:15:41"
  content: "<p>Dear Sandy,<br />\nare you sure you are not a native new Orleanian???  You and your groups have done so much for all of us here in the greater New Orleans area.  I grew up not far from the London Ave. canal and my mother was still in the area when Katrina struck.  I am also a tour guide so thank you so much for giving us another way to explain to our groups exactly what happened and why.  May God bless you, your husband and all the others involve in Levee.org and the St. Bernard project.</p>\n"
