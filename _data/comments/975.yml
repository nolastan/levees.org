  content: "<p>I am a Civil Engineer who live in New Orleans East and in the weeks following Katrina I was assigned to travel New Orleans East and document the damage done to the levee system.  What I saw was 8 different places where water breached the levee system and entered the New Orleans East basin, the greatest of which was about FIVE MILES of levee along the southern flank of New Orleans East that was flattened.  This is where most of the water came from that flooded our houses.  The &#8220;levee&#8221; that failed was never designed as a hurricane protection levee.  It was basically spoil material (sand, shell and muck)from the dredging of the Intracoastal Waterway, covered with a clay cap.  Once the clay cap was compromised the whole thing came unzipped.  While the spotlight was on the drama unfolding at the 17th Street Canal, the Corps of Engineers, quietly rebuilt the levee and the press never got wind of it.  This was a disaster waiting to happen and the press has given it no attention.  They planned it to fail and they approved it and they lied to us and told us that it was safe to live in the East and when it broke they cover up the mess in the dead of night.</p>\n"
