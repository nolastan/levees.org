  date: "2009-08-27T18:15:28"
  content: "<p>the corps of engineers in 2006, june 6 in front of congress Lt. Carl strock stated that walls built by the corps of engineers failed! DESIGN DEFECT&#8230; the american society of civil engineer stated it was an &#8220;ENGINEERING EVENT &#8221; not a weather event! sheet pilings 17&#8242; feet long were inserted into peat moss and sugar sand the water that came into the canals did NOT overtop the walls it scoured underneath the walls and the walls slid back and broke thus an engineering diaster only second to Chernoble!  THE PEOPLE IN NEW ORLEANS WERE KILLED BY THE corps of enginners, our homelessness was caused by the corps of engineers, our families separated by the corps of enginners, and now the corps gives us more lies and junk pumps.  Those pumps just like those walls were suppose to work! every tax payer America should be angry because it lied not just to us but to you too.</p>\n"
