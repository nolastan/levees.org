  date: "2009-08-31T18:34:38"
  content: "<p>Speaking of fishy SPECs and USACE gravey trains, this from a 2007 News piece:</p>\n<p>&#8220;When the Army Corps of Engineers solicited bids for drainage pumps for New Orleans, it copied the specifications — typos and all — from the catalog of the manufacturer that ultimately won the $32 million contract, a review of documents by The Associated Press found.<br />\n[&#8230;]<br />\nIn a letter dated April 13, Sen. David Vitter, R-La., called on the Corps to look into how the politically connected company got the post-Hurricane Katrina contract. MWI employed former Florida Gov. Jeb Bush, President Bush&#8217;s brother, to market its pumps during the 1980s, and top MWI officials have been major contributors to the Republican Party.&#8221;</p>\n<p><a href=\"http://vidiotspeak.blogspot.com/2007/05/us-army-corruption-of-engineers-or.html\" rel=\"nofollow ugc\">http://vidiotspeak.blogspot.com/2007/05/us-army-corruption-of-engineers-or.html</a></p>\n<p>Some brought up USACE Specs.<br />\nThe lawsuit against MWI in federal court is still on-going)August 2009), that is the fraud suit, on the Nigerian bribes, and linked, to loans of many millions that some alleged were falsely certified.</p>\n<p>FEMA must have issued the trailer procurment&#8211;not the USACE, but Jesse must know more, as he is  hot on the trail of&#8230;&#8230;..(what&#8212;Jesse)  ??</p>\n"
