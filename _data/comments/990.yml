  date: "2009-08-30T16:46:16"
  content: "<p>You are correct on one thing, Caleb, pumps were invented well before 2005, and so were floodgates, and the warnings had gone on since at least the early 1980&#8217;s, and so many knew New Orleans was a sitting duck, if no floodgates, and then August 28, 2005 happened, and a City was made a lake, in a flash.<br />\nThen, floodgates were put in, and pumps over those floodgates.(after 2005), after a mass of death and destruction.<br />\nI appreciate there was a devaluation of live in New Orleans, but it was by those in power, and those who did not give a damn or care pre 2005<br />\nAnd,  Patty Whalen is correct too, Obama is out to lunch if he keeps referring to New Orleans as a natural disaster, if he just ignores the situation on no floodgates in place on 2005, and the reason that happened.<br />\nThat would compound the tragedy.<br />\nNew Orleans could have avoided being turned into a Lake in August of 2005, but there was a lack of caring.<br />\nI hope some  can get people to care.<br />\nWe all could use a lot less apathy in the nation.<br />\nTime waits for nobody, life is precious<br />\n, and each life lost because New Orleans was turned into an instant lake, was a life cut short, because some did not care, and that saddens so many of us, even today.<br />\nAnd we vow to do something so it does not happen again, soemwhere in out Nation.<br />\nCaleb, I am glad you are still her, help America to be a better place, please !</p>\n"
