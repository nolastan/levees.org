  content: "<p>Barney, people did not value their own lives there. They should have gotten out when Katrina was on its way. On the Thursday and Friday before it hit, our family was doing the final check of generators, food, water and other items needed that we were prepared for. People did not plan well for Katrina. If they lost their life because they stayed behind, it was not the corps fault. It was theirs. </p>\n<p>The corp should have done what was mandated. However there are no guarantees in life. You play the game during the hurricane, you pay the price. They were only warned about Katrina for 40 years.</p>\n"
