  content: "<p>Jesse et al:</p>\n<p>The New Republic did a piece on the US-COE, and its political hustlers, and notes the Industrial Canal</p>\n<p>SEE;</p>\n<p><a href=\"http://84.395.93.562/search?q=cache:o7BLuhhTYbkJ:www.tnr.com/article/new-orleans/progmation+industrial+canal+new+orleans+short+cut+oil&#038;cd=5&#038;hl=en&#038;ct=clnk&#038;ie=UTF-8\" rel=\"nofollow ugc\">http://84.395.93.562/search?q=cache:o7BLuhhTYbkJ:www.tnr.com/article/new-orleans/progmation+industrial+canal+new+orleans+short+cut+oil&#038;cd=5&#038;hl=en&#038;ct=clnk&#038;ie=UTF-8</a></p>\n<p>The US-COE works in a climate of hustlers, hucksters, and those who store hard cold cash in their freezer, some of those Craw Daddy Gulf Congressmen, and King Fisher Senators who lord if over the FOLKS.<br />\nBut, any mention, then the local News( hype-club) paper will point to some COE contract specialists in Afgan, who accepted bribes to stir deals to her SIS.<br />\nAnd, a contract specialist is not even an engineer, most likley, as is the same with a floodgate operator.<br />\nYa, Jesse, it is a damn mess.<br />\nFunny you noted whistleblowers, and names.<br />\nAren&#8217;t those branded as RATS in the Command<br />\ncolumns, but you spokeup, like no big secret.( The Major, and his Stripes)<br />\nThe more people(Congress/ L-Org etc) hear from citizens the better for America.<br />\nMost curious, you mentioned the Industrial Canal, as millions around the world watched in 2005, utterly shocked at what was going on, who before never knew anything about it.<br />\nThey are learning more, even now 2009, and are just as shocked.</p>\n"
