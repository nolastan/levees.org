  date: "2009-08-28T23:23:59"
  content: "<p>Why was there no floodgates in place at the end of 17th street Canal, where it intefaces with Lake Ponch.., and in place fully operational in August 2005, can some one tell us that ?<br />\nAnd that would have requried a pumping system in place too, as a full plan, but why was it missing&#8211;too, in 2005 ?<br />\nAnd, can any cite the cost for the floodgates put in on the 17th Street Canal ?<br />\nSadly, pre 2005, so much was glossed over.<br />\nAnd, Silva states it right on..(above)<br />\nSee this:</p>\n<p><a href=\"http://www.neworleanscitybusiness.com/viewStory.cfm?recID=18277\" rel=\"nofollow ugc\">http://www.neworleanscitybusiness.com/viewStory.cfm?recID=18277</a><br />\nNotes:<br />\nWeston Solutions Inc. of West Chester, Pa., will be paid $84.9 million to construct 19 pump platforms on the 17th Street and London Avenue canals. MR Pittman of Harahan was awarded a $52.5-million contract to provide the pumps, including 11 for the 17th Street Canal.<br />\n&#8230;&#8230;&#8230;&#8230;&#8230;.<br />\nBoh Brothers Construction Co. of New Orleans built interim floodgates and pumps on the 17th Street Canal for $27.8 million and MR Pittman rounded out the top five with its $25-million contract for work on the London Avenue Canal. &#8221;</p>\n<p>The floodgates did not cost $ 5 billion, so why were they not in place on August of 2005 ?<br />\nSAD&#8230; the degree of playing with people&#8217;s lives by some in HIGH PLACES&#8230;.!<br />\nJust crass recklessness</p>\n"
