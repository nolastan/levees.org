  content: "<p>Jesse:<br />\nWhile you cite some Major(see above&#8211;and the boot story), and bash the engineers at the USACE(using some army Officer story, it must be easy to target some unknown G S 12 civil (civilian) engineer.<br />\nHowever, did you look at this Jesse, given your passion for the truth:</p>\n<p>&#8220;Fluor<br />\nIn the weeks and months following the storm, (FEMA) doled out lucrative, no-bid contracts to politically connected companies. Texas-based Fluor Corp., one of the largest procurement and construction companies in the world, was one of four companies awarded contracts worth $400 million each to provide the ubiquitous “FEMA trailers” to homeless residents.(52)  The Fluor Political Action Committee donated more than $500,000 in the 2006 election cycle; when it gave directly to U.S. Congressional candidates, 74 percent of its campaign contributions went to Republicans.(53)<br />\n&#8221;<br />\nFROM<br />\n<a href=\"http://www.corpwatch.org/article.php?id=14651\" rel=\"nofollow ugc\">http://www.corpwatch.org/article.php?id=14651</a></p>\n<p>and:</p>\n<p><a href=\"http://www.corpwatch.org/article.php?id=13547\" rel=\"nofollow ugc\">http://www.corpwatch.org/article.php?id=13547</a></p>\n<p>And, Jesse,<br />\nhere is a piece reporting the Corps role in the FEMA trailer matter:</p>\n<p><a href=\"http://74.198.183.632/search?q=cache:Bopmj5KfE9UJ:www.mvm.usace.army.mil/rfo/features/trailers.htm+FEMA+trailers+Army+Corps+SPECS&#038;cd=1&#038;hl=en&#038;ct=clnk&#038;ie=UTF-8\" rel=\"nofollow ugc\">http://74.198.183.632/search?q=cache:Bopmj5KfE9UJ:www.mvm.usace.army.mil/rfo/features/trailers.htm+FEMA+trailers+Army+Corps+SPECS&#038;cd=1&#038;hl=en&#038;ct=clnk&#038;ie=UTF-8</a></p>\n<p>Maybe the G S 12&#8217;s etc at the Corps did leave their citizenship at the USACE door, to get the bread to pay the mortgage.<br />\nFLUOR is connected in the chemial area, and power and influence, or is it, as was Betchel.</p>\n"
