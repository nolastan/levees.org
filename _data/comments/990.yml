  date: "2009-08-24T20:14:55"
  content: "<p>I am still amazed at the arrogance people exhibit when nature is involved.  In 1998 my environmental geology class did a case study on New Orleans that examined how a Katrina-type event would eventually happen.  Most of the city is more than 5 meters below sea level.  It was inevitable, and not any different than living on the flanks of an active volcano.  Yes the levees did fail, but we should be thankful it was due to a Cat 3 storm and not a Cat 5.  They can re-build the levees and make them bigger and stronger, but regardless of what humans do another large storm will eventually hit New Orleans and breach or overtop the levees.  Its a city by the sea that is below sea level.</p>\n"
