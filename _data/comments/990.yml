  content: "<p>I once filed a report prepared by<br />\nH Bolton Seed, Dr Ray Seed&#8217;s  father, in<br />\nfederal court in Ca.<br />\nThe case was on   a Sierra Club funded<br />\nOrg seeking to stop a USACE dam, up<br />\nin Sonoma.<br />\nDr H Bolton Seed had been retained<br />\nby the USACE.<br />\nThe court was most impressed with his<br />\nreport<br />\nAwed might be a better word.</p>\n"
