  content: "<p>Dear Barney;<br />\nThis was a referenced to a comment over 30 years ago, in another parish and was reflective to contractors attempting to construct a project with an approved plan.  If constructed as designed, drainage would be required water to flow uphill without pumps. Maybe the quote should have read SOME Engineers.   From your carefully worded  multi-post, it seems that I may have offended you; that was not my intend.<br />\nAfter experiencing active  hostile environments within some government agencies; an atmosphere clearly designed  to use  fear to control employees from whistleblowing, I clearly understand why some would want the name of a common sense Major.  I assure you this identity has  nothing to do with today’s USACE recovery business that now provides millions in opportunities for employees, families and cronies. How much did GOA say was spent in Katrina debris contracts. Having &#8220;Close flood gates before strom surge&#8221; printed on the unsecure and/or non-existing structures may be considered common sense to some non-engineers.  Maybe you can respond to my question.  Where the flood gates left open at the container facility on the NOLA side of Industrial Canal?<br />\nBTY, is Barney your real name?<br />\ncordially<br />\n Jesse</p>\n"
