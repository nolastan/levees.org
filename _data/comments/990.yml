  date: "2009-08-28T23:51:54"
  content: "<p>Roy, </p>\n<p>There was not water there of extraordinary height, wave action,surge or pressure from those things. White puffy clouds and a breeze are not going to recreate those conditions. It takes all that happened during Katrina to contribute. And I am not saying that the levees were not of shotty quality. But what I am saying, instead of looking for a scapegoat that will only cost the taxpayers money, except the high risk, build accordingly and with every hurricane expect that this will happen. </p>\n<p>There are no guarantees in life. Extraordinary events come with the expectations of extraordinary happenings.  We must be prepared to deal with the consequences of where we live. </p>\n<p>And yes, I expect for bridges to be safe during normal times. But their may be a time when it may not be safe because of the circumstances. Just like my house may not be safe with a tornado a few feet from the roof.</p>\n"
