  avatar: "d15ab8fabf4c3449cb820f6f2b51243e0e0c2e487d939dcbef05027e8a48534b"
  date: "2009-08-28T22:49:21"
  content: "<p>The Corps of Engineers stated it was a &#8220;design defect&#8221; on june 6,2006.  Lt.Carl<br />\nStrock stated this before congress. These are his words,&#8221; We have now concluded we had problems with the design of the structure.  We hoped that wasn&#8217;t the case,but we recognize it is the REALITY!IN THE CLOSEST THING YET TO A MEA CUPA THE COMMANDER OF THE ARMY CORPS OF ENGINEERS WEDNESDAY ADMITTED THAT A DESIGN FAILURE&#8221; LED TO THE BREACHES OF THE 17 ST CANAL! June 28,2009 Stan Green Jr. Corps employee<br />\n&#8221; the people of this area experienced unparalleled loss as a consequece of the overwhelming of the levees in St. Bernard Parish and the failure of the FLOODWALLS in New Orleans.  They(people in NOLA) turned in anger on the agency(corps) responsible for the design and the construction of those levees and floodwalls.again. Mr. green states Lt. Carl Strock took reaponsibility for the failure of the poject that was intened to protect this area from hurricanes!  In the final analysis , Congress directed the corps to construct a project and that project failed to do what it ought to have done! if those walls had never been built in the levees the city would probably have experienced flooding ,but not the MAN MADE catastropic flooding caused by the walls breaking levees.  All of this it would have happened anyway,but maybe in a different scenerio: it probaly would have been when the city was asleep and there was a heavy rain event and the canals filled up with water and walls that were already leaking broke while we were sleeping&#8230; thousands upon thousands of people would have drowned.  in an experiment the corps filled the London ave. canal with water and at 5 feet walls start to crack.  I talked with a man who lived by the 17th st. canal and he was glad we evacuated because sooner or latter those walls were going to come crumbling down due to a &#8220;DESIGN DEFECT&#8221; My grandmother&#8217;s home on delacroix island existed from the 1800,s thought all of the storms and now because our oast line is gonethe old house is gone.  The MRGO built by the coprs have destroyed over 25,000 acres of our coast line.  If Holland, 25 ft. below sea level, can protect their homeland can&#8217;t the corps rebuild what they have destoyed to protect our home land or is Mr. Graves right&#8221;  they can&#8217;t be trusted!  After reading the confessions of the corps leader and its empoyee I think the answer is clear especially when this latest news about the pumps come into play.</p>\n"
