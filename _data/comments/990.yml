  date: "2009-09-01T18:01:53"
  content: "<p>I ran toxic trailers through google, and this really struck me:<br />\nQuote from the SITE:<br />\n&#8220;One thing the really bothers me(THE WWW SITE AUTHOR) about the recent Inspector General report criticizing FEMA for failing to respond to the problems with formaldehyde in FEMA housing is that names of the people who covered up and delayed for FEMA were not named and are not being required to take responsibility for their actions. Names aren’t used (like the name of the person in FEMA who received results of Sierra Club tests showing high formaldehyde levels two years before FEMA took action), only titles. No one who is responsible for Brittany’s illness and the illnesses and deaths of many others has so much has had a hand slapped. Meanwhile, families struggle with medical bills and the anguish of lives cut short.&#8221;</p>\n<p>source:<br />\n<a href=\"http://www.toxictrailers.org/\" rel=\"nofollow ugc\">http://www.toxictrailers.org/</a></p>\n<p>Notice the names of the ones involved from the Corps who botched things so badly are never named, it is the Gov, or the USACE.<br />\nBut the ASCE is real good at never naming names, they are too busy scratching backs.<br />\nWhat were the names of people in the USACE Engineering branch(ETC), are they nameless..<br />\nSad, so many died, and Congress has no clue of what the names are of the USACE people&#8230; who &gt;&gt;&gt;&gt;&gt;&gt;&gt;<br />\nFILL in the blanks&#8230;.<br />\nYour point is not missed by some, Jesse&#8230;</p>\n"
