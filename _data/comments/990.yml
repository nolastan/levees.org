  author_url: "http://www.toxictrailer.com"
  avatar: "edb0d478e04257a8b4dc14933286897b9a7b46358583dc6191d18aa0838edcaa"
  date: "2009-08-31T11:08:36"
  content: "<p>Some of USACE actions will likely be discussed in the upcoming FEMA Toxic Trailer trials beginning this month in NOLA. The trailer manufacturers are claming that the method used to block, strap and level the travel trailers caused damage to the trailers.  Travel Trailers were not designed to be placed on blocks so this action caused the exterior to skin/seams to move, buckle and leak.   The trailer industry uses construction materials such as OSB, particle board, and plywood that contain cheap water based formaldehyde glues.  It is believed that when water/moisture is allowed to contact and be absorbed into these “engineered wood products” a reaction occurs that triggers the release of the dangers of formaldehyde on unsuspecting occupant victims. This moist condition also provides a perfect environment for mold colonization.  USACE provided the specifications and procedures for FEMA trailer installations.<br />\nI once worked on public works project with a USACE Major. The Major&#8217;s comment about the Corps has always stuck with me.  “Engineers don’t have enough common sense to pour pee out of a boot, even if the instructions were on the heel”. It appears the Corp may have long history of not using common sense as a method of dealing with excessive water.  That was also my opinion when days after Katrina, I observed that the MRGO/Industrial Canal Container facility&#8217;s flood gates were still in the same position that were captured in images days before Katrina.  Where the gates left open or did the flood move them to the same partially opened/closed position?<br />\nGovernment appears to remain in damage control mode by protecting itself first rather than its victims.  Little has been done to address the health issues that will long remain with survivors/victims.  GOA reports demonstrate that disaster recovery is big business for Government agencies and their cronies.   The Government’s profit over people policies must stop.  I see little evidence that that CHANGE has begun.</p>\n"
