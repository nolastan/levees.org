  content: "<p>The Sierra Club did not sue the Corps in<br />\nany FEMA trailer matter, apparently,<br />\nbut it  or ( it&#8217;s proxies) has sued the Corps in<br />\ncases in which<br />\nDr Seed filed materials for the Corps, that<br />\nis Ray Seed&#8217;s father.<br />\nThe Sewer Districts were responsible<br />\nfor intercity canals, but maybe the La<br />\nSenators can get the U S taxpayers to<br />\nfoot so many tabs, now that the Corps<br />\nrubber stamped so many  PE&#8217;s drawings/ plans<br />\nin La who did the actual design work<br />\nthat was not up to par.<br />\nWhy would any in La want<br />\nthat disclosed, when Corp of Engineer<br />\nrubber stamps are so easy to get  in La&#8230;.?<br />\nAt least, no evidence supports the<br />\nclaim the Corps designed FEMA<br />\nsupplied trailers.<br />\nThe names covered up are private engineers<br />\nwho got design jobs, and got federal<br />\nmonies.<br />\nThe Corps knows that, too.</p>\n"
