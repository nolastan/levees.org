  date: "2009-09-01T14:42:58"
  content: "<p>I can&#8217;t speak for Barney, or any others.<br />\nHowever, Jesse,  the industrial canal was not a flood control canal, and are you suggesting the USACE/ N. O was a tool of the oil industry for a short cut out to the Gulf.<br />\nAlso, as to the floodgate on some NOLA side near some short cut canal, who was operating the gates(fllodgates), any, how do you know it was an engineer in charge ?<br />\nAs to floodgates at the 17th Street Canal in August 2005, there were none.<br />\nAs to the Corps and its Divisions, Branchs, sections, often there is conflict in the Corps, itself, between the Engineering branch, and the Construction -Ops branch, word has it  out in the Field areas.<br />\nI suppose it would be common sense that water flows down hill.<br />\nBut on August of 2005, water was flowing in from the Lake surge, a massive force, head of power, and it was flowing out from the canal drainage, so water was flowing in one hell of a swirling fury.<br />\nI am not offended by your remarks, Jesse, tell it like it is, if any others were, they should not be, you have a right to your opinion/ views.<br />\nI use a screen-name, my real name is not Norm.<br />\nI suppose I could have used the S-Name Stormin Norman. I did not use the S-name Stevo, that must have been taken by one in the planning branch of USACE, N O.<br />\nAs to my real name, I am not in the news, not<br />\na crane operator, so i am just giving my 2 cents, as an American taxpayer.<br />\nI belive I earned that right.<br />\nI assume you real name is<br />\nJesse F, and you are the one noted in the FEMA trailer mess, so many pieces filling news articles.<br />\nHope all goes well for you,<br />\nand it works out ok down the road.</p>\n"
