  content: "<p>It is really ironic, OSC sent a report to the President, by a guy who is attacking Obama&#8217;s Health care plans.(all his op-ed in foreign papers, etc)<br />\nHe put in his report that OSC orderd him  to limit his interviews, not to look at things, it was so strange.(Was like some CYA Navy skipper exercise)<br />\nRead the limitations put in the OSC report.<br />\nIt is almost a joke.<br />\nAlso, other cyber-sites are saying MWI was awarded a $ 26 million USACE contract, so how is this site getting up to $ 450 million to lay all that on MWI ?<br />\nWhat is the  La Senator doing in Holland with the EPA Queen, is she going to build a big pump, too ?</p>\n"
