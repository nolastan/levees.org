  date: "2009-08-31T17:52:11"
  content: "<p>Where is the USACE coming up with SPECS to cause MOLD in trailers(sold by pvt companies), or for engines that are junk, or pumps that are crap.<br />\nThen, there is the inspection arm of the USACE in Construction Operations, if the stuff in the field(out on the engineering branch) does not work, change  orderss are issued, a mode to change the SPECs, to lessen the requiremnts, so the CRAP can be paid for, to shove $$$ out the door.<br />\nThe more the USACE screws up, the more money Congress doles out to it.<br />\nIt goes beyond pouring pee out of a jack boot.<br />\nMost civilians&#8211; rank and file workers&#8211; who raise questions about all the crappy things that go on in the USACE, risk a career ending move if any  raise questions.<br />\nPeople are taught to shut up, and be quite in the USACE.<br />\nA USACE employee with 2 kids, house payments and car payments is on the edge of living pay check to pay check,<br />\nDo they like all the crap they see going on.<br />\nMost don&#8217;t, but a climate of fear prevades the USACE.<br />\nSee the Halliburton model, and the way the USACE is a tool of political big WIGS.<br />\nThe Corps is filled with civilians, under the CHAIN of Pentagon command.<br />\nAny want to get into the RING Knocker culture, that might piss off some here.<br />\nBut, Jese in some respects hit the nail on the head.<br />\nWho puhsed the SPECs in the trailer deal, Jesse, seeing the USACE as a Sucker for someone cutting a fat hog ?<br />\nDid you leave out that part.<br />\nThere is another norm in the USACE, which is well stated.<br />\nSHIT runs down hill, meaning the Upper Chain of command, jerks the lower chain, and when an order is given by a Major to pour piss out of boot, he better do it, even if he is a PH&#8217;D in engineering.<br />\nEven if a major is a total moron, he can give orders, and he can tag engineers as mere piss ants.<br />\nThanks for clarfying the pecking order at USACE, Jesse.<br />\nby the way, one can be a Deputy commander at an Engineering District as a major.<br />\ninteresting, the Major pouring shit all over his men in the field, as told by Jesse.<br />\nIndeed, more telling in more ways than one.<br />\nTell it like it is Jesse,<br />\nthis seems to be a place, for sunshine.<br />\nWhy, not after the stuff that happened on the levees, and sand on 17th Street &#8211;floodwalls, so called.<br />\nOn a USACE levee job(silt blanket), the USACE delted work, because the Contractor  would have to incur costs to do the rest of the job, and saving the contractor lots of money was the big thing in Construction Operations, in bed with shady contractors.<br />\nFunny, how that contractor got sued by the DOJ for fraud, as a crook, but why split hairs when a lot of piss can be poured out of boots, by Major Alphonso<br />\nTHE USACE has many good people, civilians, but it does get some Majors who are total morons, once and a while, and they can wreck havoc on an outfit.<br />\nya, major Gary with the USACE, how can any ever forget him, and the job at&#8230;.<br />\nWill leave out the particulars.<br />\nAt first some blamed FEMA, and thought it built the levees, now is this a payback on the trailers.<br />\nThe USACE is not exactly a trailer Manufacturer.<br />\nAmazing what comes out on stuff, and Majors, and their boots.</p>\n"
