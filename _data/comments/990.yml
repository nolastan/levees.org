  content: "<p>Jesse:</p>\n<p>How deep in are you on this Jesse, Good luck</p>\n<p>Interesting piece that notes you:</p>\n<p><a href=\"http://794.129.163.432/search?q=cache:KI884ISn7R4J:208.62.60.4/40/article_1430.shtml+Jesse+Fineran+FEMA+trailers&#038;cd=2&#038;hl=en&#038;ct=clnk&#038;ie=UTF-8\" rel=\"nofollow ugc\">http://794.129.163.432/search?q=cache:KI884ISn7R4J:208.62.60.4/40/article_1430.shtml+Jesse+Fineran+FEMA+trailers&#038;cd=2&#038;hl=en&#038;ct=clnk&#038;ie=UTF-8</a></p>\n<p>But Jesse Fineran, a former Hancock County Emergency Operations Center hazardous material specialist, said he brought the issue to the attention of numerous federal agencies in the daily meetings Hancock County EOC with government representatives nearly two years ago.</p>\n<p> The data was provided to Bechtel, the contractor responsible for transporting and setup of trailers. Fineran said both Sid Melton, now chief of operations in Mississippi, and Michael Andrews, chief of mobile home operations in Mississippi, received the OSHA report in December 2005.<br />\n&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&#8230;<br />\nFineran said the issues and the way FEMA has dealt with them will be more difficult to recover from than the hurricane. Fineran calls the multiple mistakes made by the agency &#8220;Hurricane FEMA.&#8221;<br />\n&#8220;To me, the effect of what FEMA has done is taking longer than recovery from the storm,&#8221; Fineran said. &#8221;</p>\n<p>I gather you never worked for the USACE, or were a Major.<br />\nBrownie&#8212; LIL Ol brownie the FEMA director, he never disigned any SPECS on anything Earthly, at all</p>\n<p>I wish you well Jesse, what happnened in New Orleans in 2005, is still reaping a whirl wind in people&#8217;s lives.</p>\n"
