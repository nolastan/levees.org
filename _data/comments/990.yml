  date: "2009-08-25T02:02:41"
  content: "<p>Ron: Let&#8217;s see&#8230;you here assert that you and we should take your geology class case study in 1998 projections over the documented review of Independant engineers re what occured here? &#8230;after the fact with reviews of specifications that were in fact not accuratetly prepared to match even the most basic of soil sample and structural analysis needs?</p>\n<p>Ron&#8230;get real. We have.<br />\nI suggest you take your current geology class on a field trip..start with reading all of the analysis given even on this site with citations to documentation external to the site.</p>\n<p>Moreover after you do that go see if you can find the guy recently fired by LSU from the Hurricane Center because alas..<br />\nhe kept speaking the truth.</p>\n<p>Your comment and Chad&#8217;s are ongoing reasons among many why the past Administration&#8230;the Past Congress and the Present President now playing golf..as well as the Present Congress..playing chicken continue to get away with shoving aside the incompetance and arrogance of the Corps of Engineers and its cronies&#8230;its contractors.</p>\n"
