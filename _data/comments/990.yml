  avatar: "ef4019f64103c2525c4259f95a6235bfdaa10e69fe99deb981a9823b8d606946"
  date: "2009-08-27T16:31:15"
  content: "<p>Sorry, I had to rush for my lunch break, and had a few typos, like &#8220;rusing down the canal&#8221;, of course the word is &#8220;rush&#8221;.<br />\nSo, what about the truth on the floodgates that were not in place on August 2005 ?<br />\nAt the end of 17th Street Canal(WHERE END OF CANAL MEETS LAKE  P&#8230;) ?<br />\nAlso, the P R Director(USACE&#8211;HOLDER) claims Corps employees do not leave their citizenship at the front door when they work for the Corps.<br />\nOh, really every hear of the chain of command.<br />\nSandy, was noting that the USACE is filled with civilians.<br />\nWho commands those civilians, what about those 3 Star guys in the Pentagon, the Director of Civil Works, etc, &amp; the guys with Stars @ Divison(Chain of command)<br />\nSo, do the pumps work, not work, etc ?<br />\nAnd, all that stuff on Jeb Bush, is that a smoke-screen as to MWI ?..is it what floating over the WEB by&#8230;.?<br />\nThe Office of Special Counsel has a sordid history of ignoring what most federal rank and file civil servants bring to its attention on major concerns. That is a major disaster tragedy of its own.<br />\nFEMA did not build the leveees, FEMA did not get billions over the years to move dirt in New Orleans. Talk about fall guys, and scape-goats. This is not to discount the pathetic response of FEMA in Aug-Sept of 2005, but FEMA became a sponge to absorb the blame, which laid with the USACE, and its local sponsors, levee(La) Boards et al.<br />\nThe Corps knew, when it was building the levees on the side of the 17th Street Canal, the area was boggy, and sandy, and the piling was never driven to its proper depth.(A coverup of staggering scope)<br />\nDr Seed knew that, as did other investigators(post 2005).<br />\nWhat in the hell was wrong with the USACE management(or mismanagemet ) ON THAT ????<br />\nThat should concern President Obama, as Commander and Chief&#8211;and of course every taxpayer in America !</p>\n"
- id: 1230
  parent: 0
  author: "Roy"
  author_url: ""
  avatar: "c6f71af0873ac95642ecfdc57c0e38885ed5426baa8c5c26f2ab01adb7ebebde"
  date: "2009-08-27T17:25:26"
  content: "<p>Ron and Chad, you are so wrong.  There are countries where the majority of the country is below sea level.  Those countries have good flood protection and they don&#8217;t flood. </p>\n<p>Do you travel over bridges?  Do you actually drive a car made of a few thousand pounds of steel hundreds of feet into the air over a ribbon of poured concrete that weighs hundreds or even thousands of tons and not expect it all to collapse to the ground?  You do this every time you drive on an overpass and Of course you expect it to stay up!  That&#8217;s what good engineering does.  Plus you expect it to stay up time after time, as long as it is only subjected to conditions within what it was designed for.  </p>\n<p>Should we not expect the same from our levees?  It can be done.  It is done elsewhere.  If not why would they give us any ratings or assurances of their work as they do.  If we are told it is ok to build our lives in an area because we have built for you a certain level of protection, shouldn&#8217;t we expect that level of protection?</p>\n<p>If you drove a small 3,000 pound car across a bridge that had a sign &#8220;This bridge is rated to 10,000 pounds&#8221; do you expect it to hold up?</p>\n<p>I wonder if we passed a law that exempted out country&#8217;s bridge builders from any liability should any of their bridges collapse, what kind of bridges do you think we would have?  Better bridges?  I don&#8217;t think so. </p>\n<p>What caliber of bridge builders and engineers do you think that such a law would attract to the bridge building industry?  Better engineers?  I think not.  This is essentially what we have in our current levee builders.  I personally feel that the very same law that gave this immunnity to our levee builders also ruined them as quality levee builders.  it has certainly ruined our confidence in them.</p>\n<p>Caleb, your comments are also factually wrong as well.  Go look over those levees, the water is there and the water is higher than the surrounding land EVEN ON DAYS WHEN THERE IS NO HURRICANE! Your statement actually says that if and when there are no hurricanes, then there is no water that is not correct.</p>\n"
- id: 1231
