  content: "<p>Thanks, Jesse:<br />\nYou notice whenever any sue FEMA, or the COE, the DOJ files enldess motions to get rid of the suits, often so soom poor harmed person never ges his day in Court.<br />\nThat seems to be what is happening in the matter you referenced.<br />\nTHE DOJ will motion the matter to death.</p>\n<p>I am not disputing what you say, the COE is good a burying things in its many obfuscations, but the DOJ is even better at filing motions to stop most citizens from even getting their day in court&#8211;on the merits of the matters where they have been harmed.<br />\nHowever, Judge Duvall may not fall for all the DOJ running interference for the COE&#8211;these time on some things.<br />\nIf you have material info, bring it out, if you are a witness stand up, if you know something you feel you have a civic duty to shine sunshine on, let it come out.<br />\nDon&#8217;t let any scare you off Jess, step up to the plate, raise your right hand, and tell it like it is(in a forum that counts), if it helps some citizen.<br />\nYou know more on the trailer matters than most, GOOD LUCK</p>\n"
