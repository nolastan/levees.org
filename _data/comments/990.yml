  date: "2009-09-01T15:28:48"
  content: "<p>Jesse:<br />\nYou are not the only one in the news:<br />\nHow about this, (FROM AP)<br />\n&#8220;Critics say the probes, commissioned and funded by federal agencies, were more about covering up human and agency misdeeds than determining what went wrong with the failed structures.</p>\n<p>Last month, the society&#8217;s Task Force on Engineering Reviews said Reston, Va.-based ASCE should draw up an ethics policy to eliminate questions of possible conflicts of interest.</p>\n<p>The panel started work after Raymond Seed, a levee expert with the University of California-Berkeley, sent a 42-page letter to ASCE in October 2007 accusing it of colluding with the Army Corps of Engineers to cover up engineering flaws found after Katrina struck in August 2005. Seed was on an independent levee investigation team funded by the National Science Foundation.</p>\n<p>Seed&#8217;s team said corps and ASCE reports placed too much blame on the power of Katrina and did not spend enough time studying design flaws. The independent team also complained that the Army Corps and ASCE team obstructed access to data and tried to keep them away from the site of one of the major levee failures.</p>\n<p>The letter also revived accusations that ASCE&#8217;s examination of the World Trade Center collapse was flawed. Critics have charged the group wrongly concluded the skyscrapers could not have been designed to withstand aircraft strikes.</p>\n<p>Source:<br />\n<a href=\"http://seattletimes.nwsource.com/html/nationworld/2008288505_apembattledengineers.html\" rel=\"nofollow ugc\">http://seattletimes.nwsource.com/html/nationworld/2008288505_apembattledengineers.html</a></p>\n<p>In August of 2005, wind determined the flow paramaters of water in from the Lake.<br />\nWind caused the surge of waters to lift off the normal lake level  some significant number of feet.<br />\nIt is a bit more complex than a drainage canal in the Delta.<br />\nIt is ironic, Seed(Ray) wrote a memorial piece for his dad that noted his dad received more awards from the ASCE than any member in its history.<br />\nIf you have a beef with enginers, hay, no skin off my nose, we know that engineers can&#8217;t walk on water, at least if it is not frozen.<br />\nAnd, in August in New Orleans water is not frozen.</p>\n"
