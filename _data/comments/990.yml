  date: "2009-09-01T19:08:18"
  content: "<p>Becky Gillette &amp; Sierra Club&#8217;s effort brought this issue to attention of congressional investigative committees.  Becky is also responsible for <a href=\"http://www.toxictrailers.com\" rel=\"nofollow ugc\">http://www.toxictrailers.com</a>.  It is the general consensus of  the FEMA victims that the OIG report was a softball attempt to demonstrate that FEMA did something wrong without coming close to  opening any  door  providing accountability in Recovery agencies.   FEMA and  CDC behavior  will likely have long term heath effects on many that stayed in trailers for long periods.  The congressional investigations produced emails between the players in FEMA, the committees e-published the emails. This pointed to more evidence that FEMA, OSHA, EPA and CDC obscured the dangers of formaldehyde  from the survivors occupants.  These survivors have become victims of  agency CYA policies.  It is an inter fact that FEMA refers to disaster survivors as victims.  February 2008 CDC was required to come clean about the IAQ danger in trailers because of a CDC whistleblower.   The OIG report does appear to show that  OSHA/FEMA was aware of problem before FEMA claims they were aware of any IAQ issues.   FEMA knew the occupants were suffering and did nothing but protect itself.</p>\n"
