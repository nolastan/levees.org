  avatar: "ef4019f64103c2525c4259f95a6235bfdaa10e69fe99deb981a9823b8d606946"
  date: "2009-08-27T15:06:35"
  content: "<p>Any who looked at old photos of of the 17th Street Canal, pre August 2005, could see that:<br />\n1) there was no floodgates at the Lake P(interface) end of the canal, and most in New O, knew a surge would come off of Lake P of over 4 feet in heavy wind events, storms tropcial, or cains, rusing down the canals.<br />\n New O was a sitting duck, the clock was ticking, had been ticking for some long time. On that, and that was a warning pre 2005, for some time, dire warnings, ignored, why no caring&#8211;where it counted ?<br />\nSo, in a rush in 2006, floodgates were put in( see photos post 2005 on that at far end of 17th Street Canal).<br />\nYet, why were they not there pre 2005 ?<br />\nKnowing a thing or two about the USACE, i urge your Org, and readers, all citizens to foucs there for answers. Demand them, full sunshine, etc.<br />\nNow, on to the pumps, and the WMI mess etc:<br />\nThe entity who did the report for the Office of special Counsel(OSC), Apariq, never lists the individuals who made conclusions, and their  expertise.(Absent most glaring).<br />\nApariq list a ton of DOD stuff, so, if the claim about not working for the Corps before is  kinda true, in small part,(maybe), &amp;  since taxpayers should know, what pump companies did it(Apariq) work for, experience etc..?????<br />\nNot, sure how many of you read the Apariq so called conclusionary report, one where it outlines that OSC limited who it could speak to, what it could see, and it looked like it had blinders put on it. Staggering.<br />\nNow, this is not to discount any search for the full truth(underscore full), any can read about Parsons in Iraq, and some oil meters or lack thereof, critical points in Iraq( see the pieces on stealing oil, rampant corruption) and I urge you to google that<br />\nOil and water don&#8217;t mix.<br />\nAs to Sandy, and<br />\nher point, the USACE is mostly civilians( 98 or so %), and not military offices, then<br />\nif any attack the USACE they are not attaking the U S Military, that misses the point.<br />\nThe USACE is a federal agency, don&#8217;t we all want the truth, New Orleans is not Iraq, or a green battle zone, we all should want accountability. hopefully, that is the postore of President Obama, in view of the recent letter to him from OSC in D C.<br />\nAfter all was it not a woman civil servant, who had concerns, she was not some 3 Star General.<br />\nWhen water rused down the 17th stret canal in August 2005, it took out levees, that performed no better than sand castles, on a beach in the tidal zone, build by a 3 year old. Yes, Dr Seed was correct, about this tragic disaster.<br />\nI know Dr Seeds&#8217; background, and expertise in engineering. Why is that of Apariq like some stealth cloud, so illusive to be absent in the particulars on the matter in question, does that not concern you, since you profess to be looking for the truth.</p>\n"
