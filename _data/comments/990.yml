  date: "2009-09-01T16:33:53"
  content: "<p>Norm, thx for links. Could not open CE pages.  In Mississippi Bechtel was preferred contractor for FEMA and USACE trailer related contracts. I am aware that Fluors did construct  two parks in Hancock county. Trailer related litigation can be tracked on US District Court, Eastern District site.<br />\n<a href=\"http://www.laed.uscourts.gov/FEMA07md1873/FEMAtrailer.htm\" rel=\"nofollow ugc\">http://www.laed.uscourts.gov/FEMA07md1873/FEMAtrailer.htm</a><br />\nIt was my understanding that FEMA requested USACE to provide Spec for blocking and strapping of travel because FEMA legal was concerned that unsecured units were a FEMAs legal exposure with RITA in the Gulf.<br />\nWhat I am referring is a wall type structure with several sliding gates or walls that run between the IC and the container facility.  I was reviewing  some Mid Sept. 2005 fly over photos showing that these movable devices in the same location can be seen in  did pre-Katrina satellite images.   After 4 years,  I can’t seem to find anyone interested in these photos and/or willing /able to provide a answer this question.  I am simply interested in the truth and find the CE inspired explanations a bit difficult to accept.</p>\n"
