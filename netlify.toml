# Netlify is used only for deploy previews: every pull request gets its own preview
# site (https://deploy-preview-<number>--<site>.netlify.app) so a change can be seen
# before it goes live. The live site is still built by GitHub Actions and served by
# GitHub Pages (.github/workflows/deploy.yml). See docs/setup-for-stan.md.

[build]
  command = "bundle exec jekyll build && npx --yes pagefind@1.3.0 --site _site"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.6"
  NODE_VERSION = "22"
  LANG = "C.UTF-8"
  JEKYLL_ENV = "production"

# Keep every Netlify copy of the site out of search engines; only levees.org counts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
